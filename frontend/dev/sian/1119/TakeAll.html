<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&amp;family=Barlow:wght@400;500;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap">
<link rel="stylesheet" href="_s.css">
<title>내 기록 전부 받기</title>
<style>
.chip{min-height:36px;padding:0 12px;border:1px solid #4a3f2c;border-radius:999px;background:none;color:#cfc6b2;font:600 12.5px 'Barlow','IBM Plex Sans KR',sans-serif}
.chip.on{border-color:#eeb77d;color:#eeb77d;background:#241a11}
.row{display:flex;align-items:center;gap:8px}
.mut{color:#aaa28e;font-size:12.5px}
.big{font:34px/1 'Bebas Neue',sans-serif;letter-spacing:1px;color:#eae4d6}
.ln{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid #2a2318;font-size:13.5px}
.ln:last-child{border-bottom:none}

.ck{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #2a2318;font-size:13.5px}
.ck:last-child{border-bottom:none}
.bx{width:17px;height:17px;border:1px solid #4a3f2c;border-radius:2px;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:#eeb77d;font-size:12px}
.bx.on{border-color:#eeb77d;background:#241a11}

</style>
</head>
<body>
<div class="ph">
  <header class="hd">
    <span class="logo">BLACK IRON</span>
    <button class="acc" style="margin-left:auto" aria-label="내 계정"><span class="av">S</span><span class="n">seeddemo</span></button>
  </header>
  <main style="padding:18px 20px 90px">
    <div class="st"><div class="bar"></div>설정 · 내 기록

    </div>

    <div class="card">
      <div class="lbl">지금 받을 수 있는 것</div>
      <div class="ck"><span class="bx on" aria-hidden="true">✓</span><span>운동 기록</span><span class="mut" style="margin-left:auto">CSV</span></div>
      <div class="ck"><span class="bx on" aria-hidden="true">✓</span><span>인바디</span><span class="mut" style="margin-left:auto">CSV</span></div>
      <div class="ck"><span class="bx on" aria-hidden="true">✓</span><span>측정 기록</span><span class="mut" style="margin-left:auto">CSV</span></div>

      <div class="nw" style="margin-top:14px">
        <div class="lbl">받을 길이 없던 것</div>
        <div class="ck"><span class="bx" aria-hidden="true"></span><span>메모 · 그날 메모</span><span class="mut" style="margin-left:auto">새로</span></div>
        <div class="ck"><span class="bx" aria-hidden="true"></span><span>내 루틴</span><span class="mut" style="margin-left:auto">새로</span></div>
        <div class="ck"><span class="bx" aria-hidden="true"></span><span>기구 세팅</span><span class="mut" style="margin-left:auto">새로</span></div>
        <div class="ck"><span class="bx" aria-hidden="true"></span><span>사진</span><span class="mut" style="margin-left:auto">새로 · 무겁다</span></div>
      </div>
      <button class="btn1" style="margin-top:14px">한 묶음으로 받기</button>
    </div>

    <div class="say">
      <span class="ic" aria-hidden="true">●</span>
      <div><b style="color:#eae4d6">계정을 지우기 전에 쓸 것입니다.</b> 30일 유예 뒤 지워지니
      (<span class="mut">8/31 결정</span>) 그 전에 <b style="color:#eae4d6">전부</b> 받아둘 길이 있어야 합니다.</div>
    </div>

    <div class="flat">지금은 셋만 CSV 로 나갑니다 — <b style="color:#cfc6b2">메모 · 루틴 · 기구 세팅 · 사진은 길이 없습니다.</b>
      통째로 받는 길(<span class="mut">routes/export.js:103</span>)은 <b style="color:#cfc6b2">관리자만</b> 씁니다.</div>
  </main>
  <nav class="tb" aria-label="하단 네비게이션"><button class="tab"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="5.6" r="2.4"></circle><path d="M8.4 10.4h7.2l-.9 4.6H9.3z"></path><path d="M9.6 15 9 20.4M14.4 15l.6 5.4"></path></svg><span>오늘</span></button><button class="tab"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.2 9.3v5.4M7.2 6.8v10.4M16.8 6.8v10.4M19.8 9.3v5.4"></path><path d="M7.2 12h9.6"></path></svg><span>운동</span></button><button class="tab"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.8" y="5.4" width="16.4" height="14.4" rx="2"></rect><path d="M3.8 10h16.4"></path><path d="M8.2 3.6v3.4M15.8 3.6v3.4"></path></svg><span>기록</span></button><button class="tab on"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19.5h16"></path><path d="M7.5 19.5v-5.2M12 19.5v-9.4M16.5 19.5v-7"></path></svg><span>몸</span></button></nav>
</div>
</body>
</html>
