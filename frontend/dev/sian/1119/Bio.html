<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&amp;family=Barlow:wght@400;500;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap">
<link rel="stylesheet" href="_s.css">
<title>잠금 — 지문으로 풀기</title>
<style>
.chip{min-height:36px;padding:0 12px;border:1px solid #4a3f2c;border-radius:999px;background:none;color:#cfc6b2;font:600 12.5px 'Barlow','IBM Plex Sans KR',sans-serif}
.chip.on{border-color:#eeb77d;color:#eeb77d;background:#241a11}
.row{display:flex;align-items:center;gap:8px}
.mut{color:#aaa28e;font-size:12.5px}
.big{font:34px/1 'Bebas Neue',sans-serif;letter-spacing:1px;color:#eae4d6}
.ln{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid #2a2318;font-size:13.5px}
.ln:last-child{border-bottom:none}

.kp{display:grid;grid-template-columns:repeat(3,72px);gap:10px;justify-content:center;margin-top:18px}
.kp button{min-height:62px;background:#1b1712;border:1px solid #332b1e;color:#eae4d6;font:24px 'Bebas Neue',sans-serif;border-radius:2px}
.dots{display:flex;gap:12px;justify-content:center;margin-top:14px}
.dots i{width:11px;height:11px;border-radius:50%;border:1px solid #4a3f2c;display:block}
.dots i.f{background:#eeb77d;border-color:#eeb77d}
.fp{width:54px;height:54px;border-radius:50%;border:1px solid #eeb77d;color:#eeb77d;background:#241a11;display:flex;align-items:center;justify-content:center;margin:0 auto}

</style>
</head>
<body>
<div class="ph">
  <header class="hd">
    <span class="logo">BLACK IRON</span>
    <button class="acc" style="margin-left:auto" aria-label="내 계정"><span class="av">S</span><span class="n">seeddemo</span></button>
  </header>
  <main style="padding:18px 20px 90px">
    <div class="st" style="justify-content:center"><div class="bar"></div>잠금</div>

    <div style="text-align:center;margin-top:6px">
      <div class="mut">네 자리를 치세요</div>
      <div class="dots" aria-hidden="true"><i class="f"></i><i class="f"></i><i></i><i></i></div>
      <div class="kp">
        <button>1</button><button>2</button><button>3</button>
        <button>4</button><button>5</button><button>6</button>
        <button>7</button><button>8</button><button>9</button>
        <button></button><button>0</button><button aria-label="지우기">←</button>
      </div>

      <div class="nw" style="margin-top:22px;padding-top:16px;border-top:1px solid #2a2318">
        <button class="fp" aria-label="지문으로 풀기">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true">
            <path d="M12 3.6c-4.6 0-8.4 3.8-8.4 8.4"></path><path d="M20.4 12c0-4.6-3.8-8.4-8.4-8.4"></path>
            <path d="M6.6 14.4a5.4 5.4 0 0 1 10.8-2.4"></path><path d="M9.6 17.4A2.4 2.4 0 0 1 14.4 15"></path>
            <path d="M12 20.4v-2.4"></path></svg>
        </button>
        <div class="mut" style="margin-top:8px">지문으로 풀기</div>
      </div>
      <div class="mut" style="margin-top:18px;font-size:12.5px">네 자리를 잊으셨나요</div>
    </div>
  </main>
  <nav class="tb" aria-label="하단 네비게이션"><button class="tab on"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="5.6" r="2.4"></circle><path d="M8.4 10.4h7.2l-.9 4.6H9.3z"></path><path d="M9.6 15 9 20.4M14.4 15l.6 5.4"></path></svg><span>오늘</span></button><button class="tab"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.2 9.3v5.4M7.2 6.8v10.4M16.8 6.8v10.4M19.8 9.3v5.4"></path><path d="M7.2 12h9.6"></path></svg><span>운동</span></button><button class="tab"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.8" y="5.4" width="16.4" height="14.4" rx="2"></rect><path d="M3.8 10h16.4"></path><path d="M8.2 3.6v3.4M15.8 3.6v3.4"></path></svg><span>기록</span></button><button class="tab"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19.5h16"></path><path d="M7.5 19.5v-5.2M12 19.5v-9.4M16.5 19.5v-7"></path></svg><span>몸</span></button></nav>
</div>
</body>
</html>
