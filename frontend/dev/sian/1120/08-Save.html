<!doctype html><html lang="ko"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@400;600&family=IBM+Plex+Sans+KR:wght@400;600&display=swap">
<link rel="stylesheet" href="_s.css"><title>⑧ 저장 — 자판 위에 붙는다</title></head>
<body><div class="ph" style="display:flex;flex-direction:column">
  <div class="wrap" style="flex-grow:1;overflow:hidden;padding-bottom:16px">

  <span class="tag now">지금 — 저장이 폼 끝에 있어 자판이 뜨면 화면 밖이다</span>
  <div class="half">
    <div class="mut">숫자 칸을 누르면 자판이 화면 절반을 먹는다. 그 아래에 원판 줄 · 메모 · 접힌
      칸들 · 저장이 있어서 <b style="color:#d29a5f">적고 나서 스크롤해 저장을 찾아야 한다.</b>
      세트마다 그 손이 든다</div>
  </div>

  <span class="tag new">안 — 저장이 자판 바로 위에 뜬다</span>
  <div class="half new">
    <div style="display:flex;gap:8px;margin-bottom:10px">
      <div style="flex:1.35"><label class="lbl">무게 kg</label><div class="step"><button>−</button><input class="in" value="60" style="border-color:#eeb77d"><button>+</button></div></div>
      <div style="flex:.8"><label class="lbl">세트</label><input class="in" value="4"></div>
      <div style="flex:1.35"><label class="lbl">횟수</label><div class="step"><button>−</button><input class="in" value="10"><button>+</button></div></div>
    </div>
    <div class="mut">아래에 원판 · 메모 · 칩 줄이 이어진다 (스크롤)</div>
  </div>

  </div>

  <div style="flex-shrink:0;border-top:1px solid #332b1e;background:rgba(18,16,12,.96);padding:10px 14px">
    <div style="display:flex;align-items:center;gap:10px">
      <div style="flex-grow:1;min-width:0">
        <div class="mut" style="font-size:11px">벤치프레스 · 4세트째</div>
        <div><span class="n" style="font-size:22px;color:#eeb77d">60</span><span style="font-size:12px">kg</span>
          <span class="n" style="font-size:18px;margin-left:6px">10</span><span style="font-size:12px">회</span></div>
      </div>
      <button class="btn1" style="width:auto;min-height:44px;padding:0 22px;font-size:15px">저장</button>
    </div>
  </div>

  <div style="flex-shrink:0;height:220px;background:#1b1712;border-top:1px solid #332b1e;display:flex;align-items:center;justify-content:center">
    <span class="mut">폰 자판이 서는 자리</span>
  </div>
</div></body></html>
