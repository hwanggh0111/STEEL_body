<!doctype html><html lang="ko"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@400;600&family=IBM+Plex+Sans+KR:wght@400;600&display=swap">
<link rel="stylesheet" href="_s.css"><title>⑪ 설정 — 길잡이 칩을 붙여 둔다</title></head>
<body><div class="ph" style="display:flex;flex-direction:column">

  <div style="flex-shrink:0;padding:14px 18px 0">
    <span class="tag now">지금 — 묶음 아홉이 쭉 선다 (접지 않는다 · 그 원칙은 맞다)</span>
    <div class="half" style="margin-bottom:10px">
      <div class="mut">소리 · 쉴 때 · 마이크 · 운동할 때 · 몸 · 헬스장 · 계정 · 잠금과 알림 · 기록 챙기기.
        칩 줄로 건너뛰게 해뒀지만 <b style="color:#d29a5f">굴리면 그 칩이 위로 사라진다</b> —
        그래서 중간에서 다른 묶음으로 가려면 맨 위까지 올라가야 한다</div>
    </div>
    <span class="tag new">안 — 칩 줄이 머리에 붙어 따라온다 + 지금 보는 묶음이 켜진다</span>
  </div>

  <div style="flex-shrink:0;padding:8px 14px;border-bottom:1px solid #332b1e;background:rgba(18,16,12,.96);white-space:nowrap;overflow-x:auto">
    <span class="chip">소리</span><span class="chip on">쉴 때</span><span class="chip">마이크</span><span class="chip">운동</span><span class="chip">몸</span><span class="chip">헬스장</span><span class="chip">계정</span><span class="chip">잠금</span><span class="chip">챙기기</span>
  </div>

  <div class="wrap" style="flex-grow:1;overflow:hidden;padding-top:14px">
    <div class="st"><span class="bar"></span>쉴 때</div>
    <div class="card" style="margin-bottom:10px">
      <div style="display:flex;align-items:center;gap:12px">
        <div style="flex-grow:1"><div style="font-size:13.5px">저장하면 저절로 시작</div>
          <div class="mut">끄면 예전처럼 직접 눌러서 시작합니다</div></div>
        <div style="width:40px;height:22px;border-radius:11px;background:#eeb77d;padding:3px;display:flex;justify-content:flex-end">
          <div style="width:16px;height:16px;border-radius:8px;background:#12100c"></div></div>
      </div>
    </div>
    <div class="card" style="margin-bottom:10px">
      <div style="display:flex;align-items:center;gap:12px">
        <div style="flex-grow:1"><div style="font-size:13.5px">끝나면 소리로 알리기</div></div>
        <div style="width:40px;height:22px;border-radius:11px;background:#282219;border:1px solid #4a3f2c;padding:3px;display:flex">
          <div style="width:14px;height:14px;border-radius:7px;background:#8f8471"></div></div>
      </div>
    </div>
    <div class="mut">아래로 운동할 때 · 몸 · 헬스장 … 이 이어진다</div>
  </div>
</div></body></html>
