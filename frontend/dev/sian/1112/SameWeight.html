<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>운동 — 같은 무게 최다 횟수</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&amp;family=Barlow:wght@400;500;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap">
<style>
body{margin:0;background:#0b0a08}
.ph{width:390px;height:844px;position:relative;overflow:hidden;background:#12100c;background-image:radial-gradient(120% 85% at 50% -5%,#241c14 0%,#181310 50%,#12100c 100%);color:#eae4d6;font-family:'Barlow','IBM Plex Sans KR',sans-serif;font-size:15px;line-height:1.6}
.ph *{box-sizing:border-box}
.hd{height:68px;display:flex;align-items:center;gap:10px;padding:12px 20px;border-bottom:1px solid #332b1e;background:rgba(18,16,12,.72)}
.logo{color:#eeb77d;font:21px/1 'Bebas Neue',sans-serif;letter-spacing:1.5px}
.acc{display:flex;align-items:center;gap:7px;height:44px;padding:3px 10px 3px 8px;border:1px solid #332b1e;border-radius:999px;background:none}
.av{width:26px;height:26px;border-radius:50%;background:#241a11;color:#eeb77d;font:13px 'Bebas Neue',sans-serif;display:flex;align-items:center;justify-content:center}
.acc span.n{font:600 13px 'Barlow','IBM Plex Sans KR',sans-serif;color:#aaa28e}
.st{display:flex;align-items:center;gap:8px;margin:0 0 14px;font:18px 'Bebas Neue','IBM Plex Sans KR',sans-serif;letter-spacing:2px;color:#eae4d6}
.bar{width:3px;height:18px;background:#eeb77d;flex-shrink:0}
.card{background:linear-gradient(180deg,#1e1a14 0%,#191510 100%);border:1px solid #332b1e;border-radius:2px;box-shadow:inset 0 1px 0 rgba(238,183,125,.16);padding:16px;margin-bottom:14px}
.card.focus{border-color:#eeb77d}
.lbl{font:600 12px/1.6 'Barlow','IBM Plex Sans KR',sans-serif;letter-spacing:1px;color:#aaa28e;display:block;margin-bottom:5px}
.in{width:100%;min-width:0;min-height:44px;background:#1b1712;border:1px solid #332b1e;color:#eae4d6;padding:10px 6px;font:14px 'Barlow','IBM Plex Sans KR',sans-serif;border-radius:2px;text-align:center}
.step{display:flex;gap:4px}
.step button{width:36px;min-height:44px;flex-shrink:0;background:#241a11;border:1px solid #4a3f2c;border-radius:2px;color:#eeb77d;font-size:19px;line-height:1;padding:0}
.btn1{width:100%;min-height:48px;background:#282219;border:1px solid #eeb77d;color:#eeb77d;font:17px 'Bebas Neue','IBM Plex Sans KR',sans-serif;letter-spacing:2px;padding:13px 24px;border-radius:2px}
.nw{outline:1.5px dashed #7fa8d9;outline-offset:4px}
.hit{display:flex;gap:12px;align-items:center;background:#241a11;border:1px solid #d29a5f;border-radius:2px;padding:12px 14px;margin-bottom:16px}
.hit .num{font:34px/1 'Bebas Neue',sans-serif;letter-spacing:2px;color:#eeb77d;min-width:54px;text-align:center}
.log{display:flex;align-items:center;gap:8px;padding:4px 4px 4px 12px;background:linear-gradient(180deg,#1e1a14 0%,#191510 100%);border:1px solid #332b1e;border-radius:2px;box-shadow:inset 0 1px 0 rgba(238,183,125,.16)}
.log .nm{font-size:13px;flex-grow:1}
.log .v{font-size:12.5px;color:#aaa28e}
.log button{width:44px;height:44px;border:none;background:none;color:#8f8471;display:flex;align-items:center;justify-content:center;padding:0}
.tb{position:absolute;left:0;right:0;bottom:0;display:flex;border-top:1px solid #332b1e;background:rgba(18,16,12,.94)}
.tab{flex:1;position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px 12px;border:none;background:none;color:#8f8471}
.tab span{font:11px 'Bebas Neue','IBM Plex Sans KR',sans-serif;letter-spacing:1px}
.tab.on{background:#241a11;color:#eeb77d}
</style>
</head>
<body>
<div class="ph">
  <header class="hd">
    <span class="logo">BLACK IRON</span>
    <button class="acc" style="margin-left:auto" aria-label="내 계정"><span class="av">S</span><span class="n">seeddemo</span></button>
  </header>

  <main style="padding:18px 20px 90px">
    <div class="st"><div class="bar"></div>운동 · 오늘</div>

    <div class="card focus">
      <div style="font-size:14px;font-weight:600;color:#eeb77d;margin-bottom:10px">벤치프레스</div>
      <div style="display:grid;grid-template-columns:1.4fr .7fr 1.4fr;gap:8px;margin-bottom:12px">
        <div><label class="lbl" for="w">무게 kg</label><div class="step"><button aria-label="무게 빼기">−</button><input class="in" id="w" value="80"><button aria-label="무게 더하기">＋</button></div></div>
        <div><label class="lbl" for="s">세트</label><input class="in" id="s" value="1"></div>
        <div><label class="lbl" for="r">횟수</label><div class="step"><button aria-label="횟수 빼기">−</button><input class="in" id="r" value="10"><button aria-label="횟수 더하기">＋</button></div></div>
      </div>
      <button class="btn1">이 운동 적기</button>
    </div>

    <div class="hit nw" role="status">
      <div class="num">10<span style="font-size:16px;letter-spacing:1px">회</span></div>
      <div style="flex-grow:1">
        <div style="font-size:14px;font-weight:600;line-height:1.45">80kg 으로 가장 많이 했어요 · 10회</div>
        <div style="font-size:12.5px;color:#aaa28e">전에는 9회 · 10/21</div>
      </div>
    </div>

    <div class="lbl" style="margin-bottom:6px">오늘 적은 것</div>
    <div style="display:flex;flex-direction:column;gap:5px">
      <div class="log"><span class="nm">벤치프레스</span><span class="v">80 × 1×10</span><button aria-label="벤치프레스 고치기"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L20 8l-4-4L4 16v4Z"></path><path d="M14.5 5.5 18.5 9.5"></path></svg></button><button aria-label="벤치프레스 지우기"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 7h14M10 7V4.5h4V7M7 7l1 13h8l1-13"></path></svg></button></div>
      <div class="log"><span class="nm">벤치프레스</span><span class="v">80 × 3×8</span><button aria-label="벤치프레스 고치기"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L20 8l-4-4L4 16v4Z"></path><path d="M14.5 5.5 18.5 9.5"></path></svg></button><button aria-label="벤치프레스 지우기"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 7h14M10 7V4.5h4V7M7 7l1 13h8l1-13"></path></svg></button></div>
      <div class="log"><span class="nm">인클라인 덤벨 프레스</span><span class="v">26 × 3×10</span><button aria-label="인클라인 덤벨 프레스 고치기"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L20 8l-4-4L4 16v4Z"></path><path d="M14.5 5.5 18.5 9.5"></path></svg></button><button aria-label="인클라인 덤벨 프레스 지우기"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 7h14M10 7V4.5h4V7M7 7l1 13h8l1-13"></path></svg></button></div>
    </div>
  </main>

  <nav class="tb" aria-label="하단 네비게이션">
    <button class="tab"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="5.6" r="2.4"></circle><path d="M8.4 10.4h7.2l-.9 4.6H9.3z"></path><path d="M9.6 15 9 20.4M14.4 15l.6 5.4"></path><path d="M8.4 11.4 5.6 13M15.6 11.4 18.4 13"></path></svg><span>오늘</span></button>
    <button class="tab on" aria-current="page"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.2 9.3v5.4M7.2 6.8v10.4M16.8 6.8v10.4M19.8 9.3v5.4"></path><path d="M7.2 12h9.6"></path></svg><span>운동</span></button>
    <button class="tab"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.8" y="5.4" width="16.4" height="14.4" rx="2"></rect><path d="M3.8 10h16.4"></path><path d="M8.2 3.6v3.4M15.8 3.6v3.4"></path><path d="M8 13.6h2M14 13.6h2M8 16.6h2M14 16.6h2"></path></svg><span>기록</span></button>
    <button class="tab"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19.5h16"></path><path d="M7.5 19.5v-5.2M12 19.5v-9.4M16.5 19.5v-7"></path></svg><span>몸</span></button>
  </nav>
</div>
</body>
</html>
