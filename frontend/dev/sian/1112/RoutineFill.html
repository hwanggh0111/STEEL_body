<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>루틴 — 그날 한 대로</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&amp;family=Barlow:wght@400;500;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap">
<style>
body{margin:0;background:#0b0a08}
.ph{width:390px;height:844px;position:relative;overflow:hidden;background:#12100c;background-image:radial-gradient(120% 85% at 50% -5%,#241c14 0%,#181310 50%,#12100c 100%);color:#eae4d6;font-family:'Barlow','IBM Plex Sans KR',sans-serif;font-size:15px;line-height:1.6}
.ph *{box-sizing:border-box}
.hd{height:68px;display:flex;align-items:center;gap:10px;padding:12px 20px;border-bottom:1px solid #332b1e;background:rgba(18,16,12,.72)}
.logo{color:#eeb77d;font:21px/1 'Bebas Neue',sans-serif;letter-spacing:1.5px}
.acc{display:flex;align-items:center;gap:7px;height:44px;padding:3px 10px 3px 8px;border:1px solid #332b1e;border-radius:999px;background:none}
.av{width:26px;height:26px;border-radius:50%;background:#241a11;color:#eeb77d;font:13px 'Bebas Neue',sans-serif;display:flex;align-items:center;justify-content:center}
.acc span.n{font:600 13px 'Barlow','IBM Plex Sans KR',sans-serif;color:#aaa28e}
.crumb{display:flex;align-items:center;gap:6px;min-height:44px;padding:0 20px;border-bottom:1px solid #332b1e;font-size:13px;color:#aaa28e;background:none;border-top:none;border-left:none;border-right:none;width:100%}
.lbl{font:600 12px/1.6 'Barlow','IBM Plex Sans KR',sans-serif;letter-spacing:1px;color:#aaa28e;display:block;margin-bottom:5px}
.in{width:100%;min-height:44px;background:#1b1712;border:1px solid #332b1e;color:#eae4d6;padding:11px 14px;font:14px 'Barlow','IBM Plex Sans KR',sans-serif;border-radius:2px}
.nw{outline:1.5px dashed #7fa8d9;outline-offset:4px}
.note{background:#241a11;border:1px solid #d29a5f;border-radius:2px;padding:12px 14px;margin-bottom:18px}
.ex{display:grid;grid-template-columns:1fr 56px 14px 56px 44px;align-items:center;gap:6px;padding:6px 6px 6px 12px;background:#1b1712;border:1px solid #332b1e;border-radius:2px}
.ex .nm{font-size:13.5px}
.ex input{width:56px;min-height:40px;text-align:center;background:#12100c;border:1px solid #332b1e;color:#eae4d6;font:16px 'Bebas Neue',sans-serif;letter-spacing:1px;border-radius:2px}
.ex .x{color:#8f8471;font-size:12px;text-align:center}
.del{width:44px;height:44px;border:none;background:none;color:#8f8471;display:flex;align-items:center;justify-content:center;padding:0}
.btn1{width:100%;min-height:48px;background:#282219;border:1px solid #eeb77d;color:#eeb77d;font:17px 'Bebas Neue','IBM Plex Sans KR',sans-serif;letter-spacing:2px;padding:13px 24px;border-radius:2px}
.btn2{min-height:44px;background:none;border:1px solid #4a3f2c;color:#aaa28e;font:14px 'Bebas Neue','IBM Plex Sans KR',sans-serif;letter-spacing:1.5px;padding:8px 20px;border-radius:2px}
.tb{position:absolute;left:0;right:0;bottom:0;display:flex;border-top:1px solid #332b1e;background:rgba(18,16,12,.94)}
.tab{flex:1;position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px 12px;border:none;background:none;color:#8f8471}
.tab span{font:11px 'Bebas Neue','IBM Plex Sans KR',sans-serif;letter-spacing:1px}
.tab.on{background:#241a11;color:#eeb77d}
</style>
</head>
<body>
<div class="ph">
  <header class="hd">
    <span class="logo">BLACK IRON</span>
    <button class="acc" style="margin-left:auto" aria-label="내 계정"><span class="av">S</span><span class="n">seeddemo</span></button>
  </header>
  <button class="crumb"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>운동 · <span style="color:#eae4d6">루틴</span></button>

  <main style="padding:16px 20px 90px">
    <div class="note nw" role="status">
      <div style="font-size:14px;font-weight:600;color:#eeb77d;margin-bottom:2px">11월 8일에 한 대로 채웠어요 · 운동 5개</div>
      <div style="font-size:12.5px;color:#aaa28e;line-height:1.55">무게는 루틴에 안 들어가요. 드롭세트 1줄과 유산소 1개(러닝머신)는 뺐어요.</div>
    </div>

    <label class="lbl" for="rname">루틴 이름</label>
    <input class="in" id="rname" value="11/08 가슴" style="margin-bottom:16px">

    <div style="display:flex;align-items:baseline;margin-bottom:6px">
      <span class="lbl" style="margin:0;flex-grow:1">운동</span>
      <span style="font-size:11.5px;color:#aaa28e">세트 × 횟수</span>
    </div>
    <div style="display:flex;flex-direction:column;gap:5px;margin-bottom:20px">
      <div class="ex"><span class="nm">벤치프레스</span><input aria-label="벤치프레스 세트" value="4"><span class="x">×</span><input aria-label="벤치프레스 횟수" value="8"><button class="del" aria-label="벤치프레스 빼기"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></button></div>
      <div class="ex"><span class="nm">인클라인 덤벨 프레스</span><input aria-label="인클라인 덤벨 프레스 세트" value="3"><span class="x">×</span><input aria-label="인클라인 덤벨 프레스 횟수" value="10"><button class="del" aria-label="인클라인 덤벨 프레스 빼기"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></button></div>
      <div class="ex"><span class="nm">케이블 플라이</span><input aria-label="케이블 플라이 세트" value="3"><span class="x">×</span><input aria-label="케이블 플라이 횟수" value="12"><button class="del" aria-label="케이블 플라이 빼기"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></button></div>
      <div class="ex"><span class="nm">딥스</span><input aria-label="딥스 세트" value="3"><span class="x">×</span><input aria-label="딥스 횟수" value="12"><button class="del" aria-label="딥스 빼기"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></button></div>
      <div class="ex"><span class="nm">푸시업</span><input aria-label="푸시업 세트" value="2"><span class="x">×</span><input aria-label="푸시업 횟수" value="20"><button class="del" aria-label="푸시업 빼기"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></button></div>
    </div>

    <button class="btn1" style="margin-bottom:8px">루틴 저장</button>
    <div style="display:flex;justify-content:center"><button class="btn2">취소</button></div>
  </main>

  <nav class="tb" aria-label="하단 네비게이션">
    <button class="tab"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="5.6" r="2.4"></circle><path d="M8.4 10.4h7.2l-.9 4.6H9.3z"></path><path d="M9.6 15 9 20.4M14.4 15l.6 5.4"></path><path d="M8.4 11.4 5.6 13M15.6 11.4 18.4 13"></path></svg><span>오늘</span></button>
    <button class="tab on" aria-current="page"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.2 9.3v5.4M7.2 6.8v10.4M16.8 6.8v10.4M19.8 9.3v5.4"></path><path d="M7.2 12h9.6"></path></svg><span>운동</span></button>
    <button class="tab"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.8" y="5.4" width="16.4" height="14.4" rx="2"></rect><path d="M3.8 10h16.4"></path><path d="M8.2 3.6v3.4M15.8 3.6v3.4"></path><path d="M8 13.6h2M14 13.6h2M8 16.6h2M14 16.6h2"></path></svg><span>기록</span></button>
    <button class="tab"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19.5h16"></path><path d="M7.5 19.5v-5.2M12 19.5v-9.4M16.5 19.5v-7"></path></svg><span>몸</span></button>
  </nav>
</div>
</body>
</html>
