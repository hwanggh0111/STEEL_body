<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>기록 — 루틴으로</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&amp;family=Barlow:wght@400;500;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap">
<style>
body{margin:0;background:#0b0a08}
.ph{width:390px;height:844px;position:relative;overflow:hidden;background:#12100c;background-image:radial-gradient(120% 85% at 50% -5%,#241c14 0%,#181310 50%,#12100c 100%);color:#eae4d6;font-family:'Barlow','IBM Plex Sans KR',sans-serif;font-size:15px;line-height:1.6}
.ph *{box-sizing:border-box}
.hd{height:68px;display:flex;align-items:center;gap:10px;padding:12px 20px;border-bottom:1px solid #332b1e;background:rgba(18,16,12,.72)}
.logo{color:#eeb77d;font:21px/1 'Bebas Neue',sans-serif;letter-spacing:1.5px}
.ib{width:44px;height:44px;display:flex;align-items:center;justify-content:center;border:1px solid #332b1e;border-radius:999px;background:none;color:#aaa28e;padding:0}
.acc{display:flex;align-items:center;gap:7px;height:44px;padding:3px 10px 3px 8px;border:1px solid #332b1e;border-radius:999px;background:none}
.av{width:26px;height:26px;border-radius:50%;background:#241a11;color:#eeb77d;font:13px 'Bebas Neue',sans-serif;display:flex;align-items:center;justify-content:center}
.acc span.n{font:600 13px 'Barlow','IBM Plex Sans KR',sans-serif;color:#aaa28e}
.st{display:flex;align-items:center;gap:8px;margin:0 0 14px;font:18px 'Bebas Neue','IBM Plex Sans KR',sans-serif;letter-spacing:2px;color:#eae4d6}
.bar{width:3px;height:18px;background:#eeb77d;flex-shrink:0}
.card{background:linear-gradient(180deg,#1e1a14 0%,#191510 100%);border:1px solid #332b1e;border-radius:2px;box-shadow:inset 0 1px 0 rgba(238,183,125,.16);padding:16px;margin-bottom:14px}
.btn2{min-height:44px;background:none;border:1px solid #4a3f2c;color:#aaa28e;font:14px 'Bebas Neue','IBM Plex Sans KR',sans-serif;letter-spacing:1.5px;padding:8px 14px;border-radius:2px;display:inline-flex;align-items:center;gap:6px}
.nw{outline:1.5px dashed #7fa8d9;outline-offset:4px}
.tb{position:absolute;left:0;right:0;bottom:0;display:flex;border-top:1px solid #332b1e;background:rgba(18,16,12,.94)}
.tab{flex:1;position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px 12px;border:none;background:none;color:#8f8471}
.tab span{font:11px 'Bebas Neue','IBM Plex Sans KR',sans-serif;letter-spacing:1px}
.tab.on{background:#241a11;color:#eeb77d}
.row{display:flex;align-items:center;gap:8px;padding:9px 12px;background:#1b1712;border:1px solid #332b1e;border-radius:2px}
.row .nm{font-size:13.5px;flex-grow:1}
.row .v{font-size:12.5px;color:#aaa28e}
.bdg{font:11px 'Bebas Neue','IBM Plex Sans KR',sans-serif;letter-spacing:1px;padding:1px 7px;border-radius:2px;border:1px solid #eeb77d;background:#241a11;color:#eeb77d}
.day{width:44px;height:58px;display:flex;flex-direction:column;align-items:center;justify-content:center;border:1px solid #332b1e;border-radius:2px;background:none;color:#aaa28e;padding:0}
.day b{font:20px/1 'Bebas Neue',sans-serif;letter-spacing:1px;color:#eae4d6}
.day small{font-size:11px}
.day.on{border-color:#eeb77d;background:#241a11}
.day.on b{color:#eeb77d}
.dot{width:5px;height:5px;background:#d29a5f;margin-top:3px}
</style>
</head>
<body>
<div class="ph">
  <header class="hd">
    <span class="logo">BLACK IRON</span>
    <button class="ib" style="margin-left:auto" aria-label="새로고침"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.6-5.9"></path><path d="M20.4 4.2v4.6h-4.6"></path></svg></button>
    <button class="acc" aria-label="내 계정"><span class="av">S</span><span class="n">seeddemo</span></button>
  </header>

  <main style="padding:18px 20px 90px">
    <div class="st"><div class="bar"></div>기록 · 11월</div>

    <div style="display:flex;gap:6px;margin-bottom:18px">
      <button class="day"><small>화</small><b>4</b><span class="dot"></span></button>
      <button class="day"><small>수</small><b>5</b></button>
      <button class="day"><small>목</small><b>6</b><span class="dot"></span></button>
      <button class="day"><small>금</small><b>7</b></button>
      <button class="day on" aria-pressed="true"><small>토</small><b>8</b><span class="dot"></span></button>
      <button class="day"><small>일</small><b>9</b></button>
      <button class="day"><small>월</small><b>10</b><span class="dot"></span></button>
    </div>

    <div style="display:flex;align-items:center;gap:8px;margin-bottom:12px">
      <span style="font:18px 'Bebas Neue','IBM Plex Sans KR',sans-serif;letter-spacing:2px;flex-grow:1">11월 8일 기록</span>
      <button class="btn2">이 달 전체</button>
    </div>

    <div style="display:flex;flex-direction:column;gap:5px;margin-bottom:16px">
      <div class="row"><span class="nm">벤치프레스</span><span class="v">80kg · 4×8</span></div>
      <div class="row"><span class="nm">벤치프레스 <span class="bdg">드롭</span></span><span class="v">60kg · 1×12</span></div>
      <div class="row"><span class="nm">인클라인 덤벨 프레스</span><span class="v">26kg · 3×10</span></div>
      <div class="row"><span class="nm">케이블 플라이</span><span class="v">15kg · 3×12</span></div>
      <div class="row"><span class="nm">딥스</span><span class="v">맨몸 · 3×12</span></div>
      <div class="row"><span class="nm">푸시업</span><span class="v">맨몸 · 2×20</span></div>
      <div class="row"><span class="nm">러닝머신</span><span class="v">20분 · 2.8km</span></div>
      <button class="btn2 nw" style="width:100%;justify-content:center;margin-top:6px"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 6h14M5 12h14M5 18h9"></path><path d="M17 16v5M14.5 18.5h5"></path></svg>이 날을 루틴으로</button>
    </div>

    <div class="card" style="padding:12px 14px">
      <div style="font-size:12.5px;color:#aaa28e">이 날 · 운동 6가지 · 19세트 · 헬스장에 1시간 4분</div>
    </div>
  </main>

  <nav class="tb" aria-label="하단 네비게이션">
    <button class="tab"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="5.6" r="2.4"></circle><path d="M8.4 10.4h7.2l-.9 4.6H9.3z"></path><path d="M9.6 15 9 20.4M14.4 15l.6 5.4"></path><path d="M8.4 11.4 5.6 13M15.6 11.4 18.4 13"></path></svg><span>오늘</span></button>
    <button class="tab"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.2 9.3v5.4M7.2 6.8v10.4M16.8 6.8v10.4M19.8 9.3v5.4"></path><path d="M7.2 12h9.6"></path></svg><span>운동</span></button>
    <button class="tab on" aria-current="page"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.8" y="5.4" width="16.4" height="14.4" rx="2"></rect><path d="M3.8 10h16.4"></path><path d="M8.2 3.6v3.4M15.8 3.6v3.4"></path><path d="M8 13.6h2M14 13.6h2M8 16.6h2M14 16.6h2"></path></svg><span>기록</span></button>
    <button class="tab"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19.5h16"></path><path d="M7.5 19.5v-5.2M12 19.5v-9.4M16.5 19.5v-7"></path></svg><span>몸</span></button>
  </nav>
</div>
</body>
</html>
