    <div class="card nw" style="text-align:center;padding:20px 16px">
      <div class="lbl" style="margin-bottom:2px">지금까지 들어올린 무게</div>
      <div style="font:54px/1 'Bebas Neue',sans-serif;letter-spacing:2px;color:#eeb77d">1,284<span style="font-size:22px;letter-spacing:1px"> 톤</span></div>

      <div style="font-size:12px;color:#8f8471;margin-top:7px;border-top:1px solid #332b1e;padding-top:9px">무게를 안 적은 세트는 톤에 안 들어갑니다 — 맨몸만 한 날은 <b style="color:#aaa28e">세트 수</b>로 셉니다</div>
    </div>

    <div class="lbl" style="margin-bottom:6px">2026년</div>

      <div style="aspect-ratio:1;background:linear-gradient(145deg,#2b2419,#191510);border:1px solid #3d3324;display:flex;align-items:flex-end;justify-content:center;padding-bottom:5px;font:12px 'Bebas Neue',sans-serif;color:#8f8471">1월</div>

      <div style="aspect-ratio:1;background:linear-gradient(145deg,#4a3b22,#221b13);border:1px solid #5c4c31;display:flex;align-items:flex-end;justify-content:center;padding-bottom:5px;font:12px 'Bebas Neue',sans-serif;color:#cfc6b2">3월</div>
      <div style="aspect-ratio:1;background:linear-gradient(145deg,#2b2419,#191510);border:1px solid #3d3324;display:flex;align-items:flex-end;justify-content:center;padding-bottom:5px;font:12px 'Bebas Neue',sans-serif;color:#8f8471">4월</div>
      <div style="aspect-ratio:1;background:#17130f;border:1px dashed #332b1e;display:flex;align-items:flex-end;justify-content:center;padding-bottom:5px;font:12px 'Bebas Neue',sans-serif;color:#6b6252">5월</div>
      <div style="aspect-ratio:1;background:linear-gradient(145deg,#5a4826,#2a2115);border:1px solid #6d5a39;display:flex;align-items:flex-end;justify-content:center;padding-bottom:5px;font:12px 'Bebas Neue',sans-serif;color:#eae4d6">6월</div>
      <div style="aspect-ratio:1;background:linear-gradient(145deg,#3a301f,#1d1812);border:1px solid #4a3f2c;display:flex;align-items:flex-end;justify-content:center;padding-bottom:5px;font:12px 'Bebas Neue',sans-serif;color:#aaa28e">7월</div>
      <div style="aspect-ratio:1;background:linear-gradient(145deg,#4a3b22,#221b13);border:1px solid #5c4c31;display:flex;align-items:flex-end;justify-content:center;padding-bottom:5px;font:12px 'Bebas Neue',sans-serif;color:#cfc6b2">8월</div>
    </div>

    <div class="flat">이 벽은 <b style="color:#cfc6b2">한 해</b>를 보여줍니다. 위의 큰 수는 <b style="color:#cfc6b2">첫 기록부터 전부</b>입니다 — 해가 바뀌어도 0 으로 돌아가지 않습니다.</div>
