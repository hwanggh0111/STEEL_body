<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&amp;family=Barlow:wght@400;500;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap">
<link rel="stylesheet" href="_s.css">
<title>운동 — 아픈 곳을 적는 자리에서도 안다</title>
</head>
<body>
<div class="ph">
  <header class="hd">
    <span class="logo">BLACK IRON</span>
    <button class="acc" style="margin-left:auto" aria-label="내 계정"><span class="av">S</span><span class="n">seeddemo</span></button>
  </header>
  <main style="padding:18px 20px 90px">
    <div class="st"><div class="bar"></div>운동 · 오늘</div>

    <div class="card focus">
      <div style="font-size:14px;font-weight:600;color:#eeb77d;margin-bottom:10px">벤치프레스</div>
      <div style="display:grid;grid-template-columns:1.4fr .7fr 1.4fr;gap:8px;margin-bottom:12px">
        <div><label class="lbl" for="w">무게 kg</label><div class="step"><button aria-label="무게 빼기">−</button><input class="in" id="w" value="80"><button aria-label="무게 더하기">＋</button></div></div>
        <div><label class="lbl" for="s">세트</label><input class="in" id="s" value="3"></div>
        <div><label class="lbl" for="r">횟수</label><div class="step"><button aria-label="횟수 빼기">−</button><input class="in" id="r" value="8"><button aria-label="횟수 더하기">＋</button></div></div>
      </div>
      <button class="btn1">이 운동 적기</button>
    </div>

    <div class="say nw" role="status">
      <span class="ic" aria-hidden="true"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M12 8.5v5.2M12 16.6v.2"/><circle cx="12" cy="12" r="8.4"/></svg></span>
      <div style="flex-grow:1">
        <div style="font-size:14px;font-weight:600;line-height:1.5">어깨가 아프다고 적어두셨어요</div>
        <div style="font-size:12.5px;color:#cfc6b2;margin-top:3px">벤치프레스는 가슴 운동이지만 <b style="color:#eae4d6">어깨도 씁니다</b>. 그래도 적으시려면 그대로 누르세요.</div>
        <div style="display:flex;gap:8px;margin-top:11px;flex-wrap:wrap">
          <button class="btn2">대신 할 것 보기</button>
          <button class="btn2">어깨 나았어요</button>
        </div>
      </div>
    </div>

    <div class="flat">아픈 곳은 <b style="color:#cfc6b2">서랍 → 부위</b>에서 적고 지웁니다. 이 화면은 그 말을 읽기만 하고, 낫는 날을 묻지 않습니다.</div>

    <div class="lbl" style="margin-bottom:6px">오늘 적은 것</div>
    <div style="display:flex;flex-direction:column;gap:5px">
      <div class="log"><span class="nm">랫 풀다운</span><span class="v">55 × 4×10</span></div>
      <div class="log"><span class="nm">시티드 로우</span><span class="v">50 × 3×12</span></div>
    </div>
  </main>
  <nav class="tb" aria-label="하단 네비게이션">
    <button class="tab"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="5.6" r="2.4"></circle><path d="M8.4 10.4h7.2l-.9 4.6H9.3z"></path><path d="M9.6 15 9 20.4M14.4 15l.6 5.4"></path></svg><span>오늘</span></button>
    <button class="tab on" aria-current="page"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.2 9.3v5.4M7.2 6.8v10.4M16.8 6.8v10.4M19.8 9.3v5.4"></path><path d="M7.2 12h9.6"></path></svg><span>운동</span></button>
    <button class="tab" ><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.8" y="5.4" width="16.4" height="14.4" rx="2"></rect><path d="M3.8 10h16.4"></path><path d="M8.2 3.6v3.4M15.8 3.6v3.4"></path></svg><span>기록</span></button>
    <button class="tab"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19.5h16"></path><path d="M7.5 19.5v-5.2M12 19.5v-9.4M16.5 19.5v-7"></path></svg><span>몸</span></button>
  </nav>
</div>
</body>
