<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&amp;family=Barlow:wght@400;500;600;700&amp;family=IBM+Plex+Sans+KR:wght@400;600;700&amp;display=swap">
<link rel="stylesheet" href="_s.css">
<title>찾기 — 이 운동을 못 할 때</title>
</head>
<body>
<div class="ph">
  <header class="hd">
    <span class="logo">BLACK IRON</span>
    <button class="acc" style="margin-left:auto" aria-label="내 계정"><span class="av">S</span><span class="n">seeddemo</span></button>
  </header>
  <main style="padding:18px 20px 90px">
    <div class="st"><div class="bar"></div>찾기</div>

    <div style="display:flex;gap:7px;margin-bottom:16px">
      <input class="in" style="text-align:left;padding-left:12px" value="벤치프레스" aria-label="운동 찾기">
      <button class="btn2" style="flex-shrink:0">지우기</button>
    </div>

    <div class="card" style="margin-bottom:10px">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">
        <span style="font-size:15px;font-weight:600;color:#eeb77d">벤치프레스</span>
        <span class="gear">바벨</span>
        <span class="gear" style="margin-left:auto">가슴</span>
      </div>
      <div style="font-size:12.5px;color:#aaa28e">bench press · 내 기록 23번 · 최고 92.5kg</div>
    </div>

    <div class="nw" style="margin-bottom:8px">
      <div class="lbl" style="margin:0 0 7px">이 운동을 못 할 때</div>
      <div style="display:flex;flex-direction:column;gap:5px">
        <div class="log" style="padding:10px 12px"><span class="nm">덤벨 벤치프레스<br><span style="font-size:11.5px;color:#8f8471">같은 결 · 바가 없어도 된다</span></span><span class="gear">덤벨</span></div>
        <div class="log" style="padding:10px 12px"><span class="nm">체스트 프레스<br><span style="font-size:11.5px;color:#8f8471">앉아서 한다 · 어깨 각이 고정된다</span></span><span class="gear">머신</span></div>
        <div class="log" style="padding:10px 12px"><span class="nm">푸시업<br><span style="font-size:11.5px;color:#8f8471">기구가 아무것도 없을 때</span></span><span class="gear">맨몸</span></div>
      </div>
    </div>
    <div class="flat nw">바꿔서 적으면 <b style="color:#cfc6b2">무게 선은 이어지지 않습니다</b> — 기구가 다르면 같은 20kg 이 같은 무게가 아니라서요. 부위로 보는 그림(<b style="color:#cfc6b2">한 부위가 늘어온 길</b>)에서는 이어집니다.</div>

    <div class="lbl" style="margin-bottom:6px">이름이 비슷한 것</div>
    <div style="display:flex;flex-direction:column;gap:5px">
      <div class="log"><span class="nm">인클라인 벤치프레스</span><span class="gear">바벨</span></div>
      <div class="log"><span class="nm">클로즈그립 벤치프레스</span><span class="gear">바벨</span></div>
      <div class="log"><span class="nm">벤치 딥스</span><span class="gear">맨몸</span></div>
    </div>
  </main>
  <nav class="tb" aria-label="하단 네비게이션">
    <button class="tab"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="5.6" r="2.4"></circle><path d="M8.4 10.4h7.2l-.9 4.6H9.3z"></path><path d="M9.6 15 9 20.4M14.4 15l.6 5.4"></path></svg><span>오늘</span></button>
    <button class="tab"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.2 9.3v5.4M7.2 6.8v10.4M16.8 6.8v10.4M19.8 9.3v5.4"></path><path d="M7.2 12h9.6"></path></svg><span>운동</span></button>
    <button class="tab" ><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.8" y="5.4" width="16.4" height="14.4" rx="2"></rect><path d="M3.8 10h16.4"></path><path d="M8.2 3.6v3.4M15.8 3.6v3.4"></path></svg><span>기록</span></button>
    <button class="tab"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19.5h16"></path><path d="M7.5 19.5v-5.2M12 19.5v-9.4M16.5 19.5v-7"></path></svg><span>몸</span></button>
  </nav>
</div>
</body>
