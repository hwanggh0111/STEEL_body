<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>개발 미리보기 — BLACK IRON</title>
<!--
  개발 전용 미리보기 (2026-10-05 · 2026-10-15 에 기기별 틀을 붙였다).

  ── 무엇을 보는 자리인가 ──

  창을 **반으로 갈라** 왼쪽은 모바일 브라우저, 오른쪽은 앱 웹뷰로 같은 개발 서버를 본다.
  다른 것은 껍데기다: 폰 브라우저는 주소창(48px)이 위를 먹고, 앱 웹뷰는 주소창 없이
  상태바(28px)만 있다. 그 차이에서만 나는 버그(아래 탭바가 가려짐 · 100vh 어긋남)를 본다.

  ── 10/15 에 더한 것 ──

  **기기를 고른다.** 여태 두 쪽은 창 크기를 그대로 썼다. 창을 줄여 가며 보면 폭은 맞춰도
  **높이가 안 맞고**, 높이에서 나는 버그(아래 탭바 · 자판이 올라올 때 가려지는 자리)는
  그렇게 안 잡힌다. 실제로 쓰이는 폰의 CSS 폭·높이를 적어두고 그대로 세운다.

  같이 더한 것 둘 —
  · **아래 홈 바**(제스처 바)를 켜고 끈다. 탭바가 그 자리에 깔리는 버그가 여기서 보인다
  · **이 PC 의 LAN 주소**를 띄운다. 폰을 들고 그대로 치면 진짜 기기에서 열린다
    (틀은 틀일 뿐이다 — 카메라 · 큰 사진 · 오프라인은 실기기에서만 밝혀진다)

  **dist 에 안 실린다.** vite 는 build 때 index.html 과 public/ 만 가져간다.
  이 파일은 frontend/dev/ 에 있어서 개발 서버에서만 열린다 (vite.config.js 의 devPreviewPlugin).
-->
<style>
  :root {
    --bg: #0d0b08;
    --panel: #16130e;
    --line: #2e2719;
    --ink: #e8e2d4;
    --dim: #8c8372;
    --gold: #c9a227;
    --chrome: #1f1b14;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 14px/1.5 'Pretendard', -apple-system, 'Segoe UI', 'Malgun Gothic', sans-serif;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ── 위의 조작줄 ── */
  header {
    flex: none;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    padding: 8px 12px;
    background: var(--panel);
    border-bottom: 1px solid var(--line);
  }
  .brand {
    font-weight: 700;
    letter-spacing: .06em;
    color: var(--gold);
    font-size: 13px;
    white-space: nowrap;
    line-height: 1.15;
  }
  .brand small { display: block; color: var(--dim); font-weight: 400; letter-spacing: 0; font-size: 11px; }

  .f { display: flex; align-items: center; gap: 5px; font-size: 12px; color: var(--dim); white-space: nowrap; }
  select, input[type="text"] {
    background: #100e0a; color: var(--ink); border: 1px solid var(--line);
    border-radius: 4px; padding: 5px 7px; font: inherit; font-size: 12px;
  }
  input[type="text"] { width: 128px; }
  select { max-width: 230px; }
  button {
    background: #100e0a; color: var(--ink); border: 1px solid var(--line);
    border-radius: 4px; padding: 5px 10px; font: inherit; font-size: 12px; cursor: pointer;
  }
  button:hover { border-color: #463c26; }
  button.on { background: var(--gold); border-color: var(--gold); color: #12100c; font-weight: 600; }
  .sp { flex: 1; }
  .sep { width: 1px; height: 20px; background: var(--line); }

  /* ── 두 쪽 ── */
  main {
    flex: 1;
    display: flex;
    gap: 1px;
    background: var(--line);
    min-height: 0;
    overflow: auto;
    padding: 0;
  }
  /* 기기 틀을 쓸 때는 가운데에 세우고 남는 자리는 비워 둔다 —
     폰보다 큰 창에서 억지로 늘리면 그건 폰이 아니다 */
  main.framed { padding: 18px; gap: 18px; justify-content: center; align-items: flex-start; background: var(--bg); }

  .pane { flex: 1; min-width: 0; display: flex; flex-direction: column; background: var(--bg); }
  main.framed .pane { flex: none; }
  .pane.hide { display: none; }

  .tag {
    flex: none; display: flex; align-items: center; gap: 7px;
    padding: 5px 10px; font-size: 11px; color: var(--dim);
    background: var(--panel); border-bottom: 1px solid var(--line);
  }
  main.framed .tag { border: 1px solid var(--line); border-bottom: 0; border-radius: 5px 5px 0 0; }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--gold); flex: none; }
  .size { margin-left: auto; font-variant-numeric: tabular-nums; }
  .size.off { color: #a8603f; }

  .screen { flex: 1; display: flex; flex-direction: column; min-height: 0; background: #12100c; position: relative; }
  main.framed .screen {
    flex: none;
    border: 1px solid var(--line);
    border-top: 0;
    border-radius: 0 0 5px 5px;
    overflow: hidden;
  }
  iframe { flex: 1; width: 100%; border: 0; background: #12100c; min-height: 0; display: block; }

  .urlbar, .statusbar { flex: none; display: flex; align-items: center; background: var(--chrome); }
  .urlbar {
    height: 48px; gap: 8px; padding: 0 12px; font-size: 12px; color: var(--dim);
    border-bottom: 1px solid #000;
  }
  .urlbar .pill {
    flex: 1; background: #0b0906; border-radius: 14px; padding: 5px 11px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .statusbar {
    height: 28px; justify-content: space-between; padding: 0 14px;
    background: #12100c; color: var(--dim); font-size: 11px;
  }
  /* 아래 홈 바(제스처 바). iOS 34px · 안드로이드 24px 쯤을 차지한다 —
     탭바가 이 자리에 깔리면 손가락이 탭 대신 홈으로 간다 */
  .homebar {
    flex: none; display: flex; align-items: center; justify-content: center;
    background: #12100c; border-top: 1px solid #000;
  }
  .homebar i { display: block; width: 36%; height: 4px; border-radius: 2px; background: #4a4335; }
  .chrome-off .urlbar, .chrome-off .statusbar { display: none; }
  .bar-off .homebar { display: none; }

  /* ── 실기기 주소 ── */
  .net {
    flex: none; display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    padding: 7px 12px; background: #110f0a; border-bottom: 1px solid var(--line);
    font-size: 12px; color: var(--dim);
  }
  .net b { color: var(--ink); font-weight: 600; }
  .net code {
    background: #0b0906; border: 1px solid var(--line); border-radius: 4px;
    padding: 3px 8px; color: var(--gold); font-family: ui-monospace, Consolas, monospace;
    font-size: 12.5px; user-select: all;
  }
  .net .why { color: #6f6757; }
</style>
</head>
<body>

<header>
  <div class="brand">BLACK IRON<small>개발 미리보기</small></div>

  <label class="f">주소
    <select id="route"></select>
  </label>
  <input type="text" id="path" value="/home" spellcheck="false" aria-label="직접 입력할 주소" />
  <button id="go">열기</button>
  <button id="reload" title="두 쪽 다 새로고침">새로고침</button>

  <div class="sep"></div>

  <label class="f">기기
    <select id="device"></select>
  </label>
  <button id="rotate" title="세로 ↔ 가로">돌리기</button>

  <span class="sp"></span>

  <button id="onlyMobile" title="모바일 쪽만">모바일만</button>
  <button id="onlyApp" title="앱 쪽만">앱만</button>
  <button id="both" class="on" title="둘을 나란히">둘 다</button>
  <div class="sep"></div>
  <button id="chrome" class="on" title="주소창 · 상태바 자리를 보일지">껍데기</button>
  <button id="homebar" class="on" title="아래 홈 바(제스처 바) 자리를 보일지">홈 바</button>
</header>

<div class="net" id="net">
  <b>진짜 폰으로 보기</b>
  <span id="netUrls">주소를 읽는 중…</span>
  <span class="why">같은 와이파이에 있어야 하고, 안 열리면 윈도 방화벽에서 5173 을 열어야 합니다 (<code>npm run phone</code>)</span>
</div>

<main id="stage">
  <section class="pane" id="paneMobile">
    <div class="tag"><span class="dot"></span>모바일 브라우저<span class="size" id="mobileTag"></span></div>
    <div class="screen" id="mobileScreen">
      <div class="urlbar"><span>🔒</span><span class="pill" id="mobileUrl">localhost:5173</span><span>⋮</span></div>
      <iframe id="mobileFrame" title="모바일 브라우저 미리보기"></iframe>
      <div class="homebar" id="mobileHome"><i></i></div>
    </div>
  </section>

  <section class="pane" id="paneApp">
    <div class="tag"><span class="dot"></span>앱 웹뷰<span class="size" id="appTag"></span></div>
    <div class="screen" id="appScreen">
      <div class="statusbar"><span id="clock">9:41</span><span>▮▮▮ ▲ 🔋</span></div>
      <iframe id="appFrame" title="앱 웹뷰 미리보기"></iframe>
      <div class="homebar" id="appHome"><i></i></div>
    </div>
  </section>
</main>

<script>
(() => {
  // ── 앱이 가진 길 (src/App.jsx 의 Route 와 맞춘다) ──
  const ROUTES = [
    ['/home', '오늘'],
    ['/train', '운동'],
    ['/history', '기록'],
    ['/body', '몸'],
    ['/routine', '루틴'],
    ['/map', '몸 지도'],
    ['/parts', '부위'],
    ['/goal', '목표'],
    ['/gym', '내 체육관'],
    ['/search', '찾기'],
    ['/homeworkout', '기능성운동'],
    ['/reminders', '운동 알림'],
    ['/support', '고객센터'],
    ['/support/notices', '공지함'],
    ['/settings', '설정함'],
    ['/admin', '관리자'],
    ['/site', '홈페이지(로그인 밖)'],
    ['/login', '로그인'],
    ['/register', '가입'],
    ['/privacy', '개인정보처리방침'],
  ];

  // ── 기기 ──
  //
  // 적는 값은 **CSS 픽셀**이다(기기 해상도가 아니다). 폰 광고의 「3200×1440」 같은 수가
  // 아니라, 브라우저가 화면 폭으로 여기는 수다 — 레이아웃은 이 수로 선다.
  //
  // 고른 기준은 「많이 쓰이는 것」과 「양 끝」이다. 양 끝이 중요하다 —
  // 제일 좁은 것에서 안 깨지고 제일 넓은 것에서 안 비어야 한다.
  const DEVICES = [
    { id: 'free',    name: '창 크기대로 (틀 없음)', w: 0, h: 0 },
    { id: 'se',      name: 'iPhone SE · 가장 좁은 쪽', w: 375, h: 667, note: '노치 없음' },
    { id: 'i13',     name: 'iPhone 13 · 14', w: 390, h: 844 },
    { id: 'i16',     name: 'iPhone 15 · 16', w: 393, h: 852 },
    { id: 'imax',    name: 'iPhone 16 Pro Max · 가장 넓은 쪽', w: 440, h: 956 },
    { id: 'galaxy',  name: 'Galaxy S24 · A 계열', w: 360, h: 800 },
    { id: 'ultra',   name: 'Galaxy S24 Ultra', w: 412, h: 915 },
    { id: 'pixel',   name: 'Pixel 8 · 9', w: 412, h: 915 },
    { id: 'fold-in', name: 'Galaxy Z Fold · 접은 채', w: 344, h: 882 },
    { id: 'fold-out',name: 'Galaxy Z Fold · 펼친 채', w: 673, h: 841, note: '태블릿처럼 넓다' },
    { id: 'flip',    name: 'Galaxy Z Flip', w: 360, h: 880 },
    { id: 'old',     name: '옛 작은 폰 (320) · 최소 폭 시험', w: 320, h: 568, note: '여기서 안 깨지면 어디서도 안 깨진다' },
  ];

  const $ = (id) => document.getElementById(id);
  let landscape = false;

  // ── 주소 ──
  const routeSel = $('route');
  for (const [p, name] of ROUTES) {
    const o = document.createElement('option');
    o.value = p;
    o.textContent = name + '  ' + p;
    routeSel.appendChild(o);
  }

  const devSel = $('device');
  for (const d of DEVICES) {
    const o = document.createElement('option');
    o.value = d.id;
    o.textContent = d.w ? `${d.name}  ${d.w}×${d.h}` : d.name;
    devSel.appendChild(o);
  }

  function load(path) {
    if (!path.startsWith('/')) path = '/' + path;
    $('path').value = path;
    $('mobileUrl').textContent = location.host + path;
    const url = location.origin + path;
    $('mobileFrame').src = url;
    $('appFrame').src = url;
  }

  // ── 기기 틀 세우기 ──
  //
  // 틀의 **바깥**이 기기 화면이다. 그래서 주소창 · 상태바 · 홈 바는 그 안에서 자리를
  // 먹고, 남는 높이가 앱이 쓰는 높이가 된다 — 진짜 폰에서 벌어지는 일과 같은 셈이다.
  function applyDevice() {
    const d = DEVICES.find((x) => x.id === devSel.value) || DEVICES[0];
    const framed = d.w > 0;
    $('stage').classList.toggle('framed', framed);
    $('rotate').disabled = !framed;
    $('rotate').classList.toggle('on', framed && landscape);

    for (const [pane, screen] of [['paneMobile', 'mobileScreen'], ['paneApp', 'appScreen']]) {
      const el = $(screen);
      if (!framed) {
        el.style.width = '';
        el.style.height = '';
        $(pane).style.width = '';
        continue;
      }
      const w = landscape ? d.h : d.w;
      const h = landscape ? d.w : d.h;
      el.style.width = w + 'px';
      el.style.height = h + 'px';
      $(pane).style.width = w + 'px';
    }
    measure(d);
  }

  // ── 쪽 보이기 ──
  function show(mode) {
    $('paneMobile').classList.toggle('hide', mode === 'app');
    $('paneApp').classList.toggle('hide', mode === 'mobile');
    $('onlyMobile').classList.toggle('on', mode === 'mobile');
    $('onlyApp').classList.toggle('on', mode === 'app');
    $('both').classList.toggle('on', mode === 'both');
    measure();
  }

  // 지금 각 쪽의 **앱이 쓰는 자리**가 몇 ×몇 인지. 껍데기를 뺀 수다 —
  // 이 수가 폰에서 앱이 실제로 받는 높이다
  function measure() {
    for (const [kind, frame] of [['mobile', $('mobileFrame')], ['app', $('appFrame')]]) {
      const r = frame.getBoundingClientRect();
      const tag = $(kind + 'Tag');
      tag.textContent = r.width ? Math.round(r.width) + '×' + Math.round(r.height) : '';
      // 320 보다 좁아지면 앱이 가로로 밀린다 — 눈에 띄게 적어둔다
      tag.classList.toggle('off', r.width > 0 && r.width < 320);
    }
  }

  // ── 진짜 폰으로 보기 ──
  //
  // vite 플러그인이 이 PC 의 사설 IP 를 준다 (`/dev/net.json`).
  // 폰을 들고 그대로 치면 열린다 — **앱은 상대 주소로 서버를 부르므로**
  // (`/api`, vite 프록시가 받는다) 폰에서 따로 설정할 것이 없다.
  fetch('/dev/net.json')
    .then((r) => r.json())
    .then(({ port, urls }) => {
      const box = $('netUrls');
      box.textContent = '';
      if (!urls.length) {
        box.textContent = '이 PC 에 와이파이·랜 주소가 안 잡힙니다';
        return;
      }
      for (const u of urls) {
        const c = document.createElement('code');
        c.textContent = `http://${u.address}:${port}/`;
        c.title = u.name + ' — 눌러서 통째로 고른 뒤 복사하세요';
        box.appendChild(c);
        box.appendChild(document.createTextNode(' '));
      }
    })
    .catch(() => { $('netUrls').textContent = '주소를 못 읽었습니다 (개발 서버에서만 됩니다)'; });

  routeSel.addEventListener('change', () => load(routeSel.value));
  $('go').addEventListener('click', () => load($('path').value.trim() || '/home'));
  $('path').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('go').click(); });
  $('reload').addEventListener('click', () => load($('path').value.trim() || '/home'));
  devSel.addEventListener('change', () => { landscape = false; applyDevice(); });
  $('rotate').addEventListener('click', () => { landscape = !landscape; applyDevice(); });
  $('onlyMobile').addEventListener('click', () => show('mobile'));
  $('onlyApp').addEventListener('click', () => show('app'));
  $('both').addEventListener('click', () => show('both'));
  $('chrome').addEventListener('click', (e) => {
    const off = document.body.classList.toggle('chrome-off');
    e.currentTarget.classList.toggle('on', !off);
    measure();
  });
  $('homebar').addEventListener('click', (e) => {
    const off = document.body.classList.toggle('bar-off');
    e.currentTarget.classList.toggle('on', !off);
    measure();
  });

  let rt;
  window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(measure, 120); });

  const tick = () => {
    const d = new Date();
    $('clock').textContent = d.getHours() + ':' + String(d.getMinutes()).padStart(2, '0');
  };
  tick();
  setInterval(tick, 20000);

  // ?path=/train&device=galaxy 로 열면 그 자리부터
  const q = new URLSearchParams(location.search);
  const want = q.get('path');
  const dev = q.get('device');
  if (dev && DEVICES.some((d) => d.id === dev)) devSel.value = dev;
  else devSel.value = 'i13';            // 기본은 제일 흔한 폰
  load(want || '/home');
  if (want) routeSel.value = want;
  show('both');
  applyDevice();
  setTimeout(measure, 300);
})();
</script>
</body>
</html>
