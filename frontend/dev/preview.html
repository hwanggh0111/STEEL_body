<!--
  개발 전용 미리보기 (2026-10-05 · 2026-10-15 에 기기별 틀을 붙였다).

  ── 무엇을 보는 자리인가 ──

  창을 **반으로 갈라** 왼쪽은 모바일 브라우저, 오른쪽은 앱 웹뷰로 같은 개발 서버를 본다.
  다른 것은 껍데기다: 폰 브라우저는 주소창(48px)이 위를 먹고, 앱 웹뷰는 주소창 없이
  상태바(28px)만 있다. 그 차이에서만 나는 버그(아래 탭바가 가려짐 · 100vh 어긋남)를 본다.

  ── 10/15 에 더한 것 ──

  **기기를 고른다.** 여태 두 쪽은 창 크기를 그대로 썼다. 창을 줄여 가며 보면 폭은 맞춰도
  **높이가 안 맞고**, 높이에서 나는 버그(아래 탭바 · 자판이 올라올 때 가려지는 자리)는
  그렇게 안 잡힌다. 실제로 쓰이는 폰의 CSS 폭·높이를 적어두고 그대로 세운다.

  같이 더한 것 둘 —
  · **아래 홈 바**(제스처 바)를 켜고 끈다. 탭바가 그 자리에 깔리는 버그가 여기서 보인다
  · **이 PC 의 LAN 주소**를 띄운다. 폰을 들고 그대로 치면 진짜 기기에서 열린다
    (틀은 틀일 뿐이다 — 카메라 · 큰 사진 · 오프라인은 실기기에서만 밝혀진다)

  **dist 에 안 실린다.** vite 는 build 때 index.html 과 public/ 만 가져간다.
  이 파일은 frontend/dev/ 에 있어서 개발 서버에서만 열린다 (vite.config.js 의 devPreviewPlugin).
-->
<style>
  :root {
    --bg: #0d0b08;
    --panel: #16130e;
    --line: #2e2719;
    --ink: #e8e2d4;
    --dim: #8c8372;
    --gold: #c9a227;
    --chrome: #1f1b14;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 14px/1.5 'Pretendard', -apple-system, 'Segoe UI', 'Malgun Gothic', sans-serif;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ── 위의 조작줄 ── */
  header {
    flex: none;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    padding: 8px 12px;
    background: var(--panel);
    border-bottom: 1px solid var(--line);
  }
  .brand {
    font-weight: 700;
    letter-spacing: .06em;
    color: var(--gold);
    font-size: 13px;
    white-space: nowrap;
    line-height: 1.15;
  }
  .brand small { display: block; color: var(--dim); font-weight: 400; letter-spacing: 0; font-size: 11px; }

  .f { display: flex; align-items: center; gap: 5px; font-size: 12px; color: var(--dim); white-space: nowrap; }
  select, input[type="text"] {
    background: #100e0a; color: var(--ink); border: 1px solid var(--line);
    border-radius: 4px; padding: 5px 7px; font: inherit; font-size: 12px;
  }
  input[type="text"] { width: 128px; }
  select { max-width: 230px; }
  button {
    background: #100e0a; color: var(--ink); border: 1px solid var(--line);
    border-radius: 4px; padding: 5px 10px; font: inherit; font-size: 12px; cursor: pointer;
  }
  button:hover { border-color: #463c26; }
  button.on { background: var(--gold); border-color: var(--gold); color: #12100c; font-weight: 600; }
  .sp { flex: 1; }
  .sep { width: 1px; height: 20px; background: var(--line); }

  /* ── 두 쪽 ── */
  main {
    flex: 1;
    display: flex;
    gap: 1px;
    background: var(--line);
    min-height: 0;
    overflow: auto;
    padding: 0;
  }
  /* 기기 틀을 쓸 때는 가운데에 세우고 남는 자리는 비워 둔다 —
     폰보다 큰 창에서 억지로 늘리면 그건 폰이 아니다 */
  main.framed { padding: 18px; gap: 18px; justify-content: center; align-items: flex-start; background: var(--bg); }

  .pane { flex: 1; min-width: 0; display: flex; flex-direction: column; background: var(--bg); }
  main.framed .pane { flex: none; }
  .pane.hide { display: none; }

  .tag {
    flex: none; display: flex; align-items: center; gap: 7px;
    padding: 5px 10px; font-size: 11px; color: var(--dim);
    background: var(--panel); border-bottom: 1px solid var(--line);
  }
  main.framed .tag { border: 1px solid var(--line); border-bottom: 0; border-radius: 5px 5px 0 0; }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--gold); flex: none; }
  .size { margin-left: auto; font-variant-numeric: tabular-nums; }
  .size.off { color: #a8603f; }

  .screen { flex: 1; display: flex; flex-direction: column; min-height: 0; background: #12100c; position: relative; }
  main.framed .screen {
    flex: none;
    border: 1px solid var(--line);
    border-top: 0;
    border-radius: 0 0 5px 5px;
    overflow: hidden;
  }
  iframe { flex: 1; width: 100%; border: 0; background: #12100c; min-height: 0; display: block; }

  .urlbar, .statusbar { flex: none; display: flex; align-items: center; background: var(--chrome); }
  .urlbar {
    height: 48px; gap: 8px; padding: 0 12px; font-size: 12px; color: var(--dim);
    border-bottom: 1px solid #000;
  }
  .urlbar .pill {
    flex: 1; background: #0b0906; border-radius: 14px; padding: 5px 11px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .statusbar {
    height: 28px; justify-content: space-between; padding: 0 14px;
    background: #12100c; color: var(--dim); font-size: 11px;
  }
  /* 아래 홈 바(제스처 바). iOS 34px · 안드로이드 24px 쯤을 차지한다 —
     탭바가 이 자리에 깔리면 손가락이 탭 대신 홈으로 간다 */
  .homebar {
    flex: none; display: flex; align-items: center; justify-content: center;
    background: #12100c; border-top: 1px solid #000;
  }
  .homebar i { display: block; width: 36%; height: 4px; border-radius: 2px; background: #4a4335; }
  .chrome-off .urlbar, .chrome-off .statusbar { display: none; }
  .bar-off .homebar { display: none; }

  /* 자판이 올라온 상태.
     세트를 적을 때(무게 · 횟수) 자판이 **화면 아래 절반을 먹는다.** 그때 적는 칸이
     가려지거나 「저장」이 자판 뒤로 숨으면 사람은 자판을 내려야 하고, 그게 세트마다다.
     여기서 그 상태를 그대로 세운다 — 높이가 그만큼 줄어든다. */
  .keyboard {
    flex: none; display: none; flex-direction: column; justify-content: flex-end;
    gap: 5px; padding: 7px 5px 9px;
    background: #1a1711; border-top: 1px solid #000;
  }
  .kb-on .keyboard { display: flex; }
  .keyboard .kbrow { display: flex; gap: 4px; }
  .keyboard .kbrow span {
    flex: 1; height: 100%; border-radius: 4px; background: #2b2619;
    box-shadow: 0 1px 0 #0b0906;
  }
  .keyboard .kbrow { flex: 1; min-height: 0; }
  .keyboard .kblabel {
    flex: none; text-align: center; font-size: 10px; color: #6f6757; letter-spacing: .08em;
  }

  /* 고른 기기가 무엇인지 · 폭 순서로 몇 번째인지 */
  .devnote {
    flex: none; display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    padding: 6px 12px; background: #13110c; border-bottom: 1px solid var(--line);
    font-size: 12px; color: var(--dim);
  }
  .devnote:empty { display: none; }
  .devnote b { color: var(--ink); font-weight: 600; }
  .devnote .px { color: var(--gold); font-variant-numeric: tabular-nums; }
  .devnote .nth { margin-left: auto; color: #6f6757; font-variant-numeric: tabular-nums; }

  /* ── 실기기 주소 ── */
  .net {
    flex: none; display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    padding: 7px 12px; background: #110f0a; border-bottom: 1px solid var(--line);
    font-size: 12px; color: var(--dim);
  }
  .net b { color: var(--ink); font-weight: 600; }
  .net code {
    background: #0b0906; border: 1px solid var(--line); border-radius: 4px;
    padding: 3px 8px; color: var(--gold); font-family: ui-monospace, Consolas, monospace;
    font-size: 12.5px; user-select: all;
  }
  .net .why { color: #6f6757; }
</style>

    { g: '접는 폰', id: 'fold1-in', name: 'Galaxy Fold(1세대) 접은 채', w: 320, h: 747, note: '제일 좁은데 길다' },
    { g: '접는 폰', id: 'fold-in',  name: 'Galaxy Z Fold(4·5) 접은 채', w: 344, h: 882, note: '좁고 아주 길다' },
    { g: '접는 폰', id: 'flip',     name: 'Galaxy Z Flip (펼친 채)', w: 360, h: 880, note: '세로로 아주 길다' },
    { g: '접는 폰', id: 'pfold-in', name: 'Pixel Fold 접은 채 ≈', w: 400, h: 820 },
    { g: '접는 폰', id: 'fold-out', name: 'Galaxy Z Fold(4·5) 펼친 채', w: 673, h: 841, note: '태블릿처럼 넓다' },
    { g: '접는 폰', id: 'pfold-out',name: 'Pixel Fold 펼친 채 ≈', w: 728, h: 840 },
    { g: '접는 폰', id: 'fold6-out',name: 'Galaxy Z Fold(6) 펼친 채 ≈', w: 729, h: 859 },

    // 폰은 아니지만 **열린다.** 넓은 자리에서 한 줄이 너무 길어지지 않는지 본다
    { g: '태블릿 (열리기는 한다)', id: 'ipad-mini', name: 'iPad mini', w: 744, h: 1133 },
    { g: '태블릿 (열리기는 한다)', id: 'tab',       name: 'Galaxy Tab A ≈', w: 800, h: 1280 },
    { g: '태블릿 (열리기는 한다)', id: 'ipad',      name: 'iPad (10세대) · Air', w: 820, h: 1180 },
    { g: '태블릿 (열리기는 한다)', id: 'ipad-p11',  name: 'iPad Pro 11"', w: 834, h: 1194 },
    { g: '태블릿 (열리기는 한다)', id: 'ipad-p13',  name: 'iPad Pro 13"', w: 1024, h: 1366, note: '여기서 한 줄이 너무 길어지지 않는지' },
  ];

  // 폭이 좁은 것부터 넘겨 보려면 이 차례다 (틀 없는 것은 뺀다).
  // 같은 폭이면 낮은 것부터 — 낮은 쪽이 더 잘 깨진다
  const ORDER = DEVICES
    .filter((d) => d.w > 0)
    .map((d) => d.id)
    .sort((a, b) => {
      const A = DEVICES.find((d) => d.id === a);
      const B = DEVICES.find((d) => d.id === b);
      return A.w - B.w || A.h - B.h;
    });

  const $ = (id) => document.getElementById(id);
  let landscape = false;

  // ── 주소 ──
  const routeSel = $('route');
  for (const [p, name] of ROUTES) {
    const o = document.createElement('option');
    o.value = p;
    o.textContent = name + '  ' + p;
    routeSel.appendChild(o);
  }

  const devSel = $('device');
  {
    // 묶음으로 나눈다 — 서른 줄이 한 뭉치로 있으면 고를 수가 없다
    const groups = new Map();
    for (const d of DEVICES) {
      if (!groups.has(d.g)) groups.set(d.g, []);
      groups.get(d.g).push(d);
    }
    for (const [name, list] of groups) {
      const parent = name
        ? Object.assign(document.createElement('optgroup'), { label: name })
        : devSel;
      for (const d of list) {
        const o = document.createElement('option');
        o.value = d.id;
        o.textContent = d.w ? `${d.name}  ${d.w}×${d.h}` : d.name;
        if (d.note) o.title = d.note;
        parent.appendChild(o);
      }
      if (name) devSel.appendChild(parent);
    }
  }

  function load(path) {
    if (!path.startsWith('/')) path = '/' + path;
    $('path').value = path;
    $('mobileUrl').textContent = location.host + path;
    const url = location.origin + path;
    $('mobileFrame').src = url;
    $('appFrame').src = url;
  }

  // ── 기기 틀 세우기 ──
  //
  // 틀의 **바깥**이 기기 화면이다. 그래서 주소창 · 상태바 · 홈 바는 그 안에서 자리를
  // 먹고, 남는 높이가 앱이 쓰는 높이가 된다 — 진짜 폰에서 벌어지는 일과 같은 셈이다.
  function applyDevice() {
    const d = DEVICES.find((x) => x.id === devSel.value) || DEVICES[0];
    const framed = d.w > 0;
    $('stage').classList.toggle('framed', framed);
    $('rotate').disabled = !framed;
    $('rotate').classList.toggle('on', framed && landscape);

    for (const [pane, screen] of [['paneMobile', 'mobileScreen'], ['paneApp', 'appScreen']]) {
      const el = $(screen);
      if (!framed) {
        el.style.width = '';
        el.style.height = '';
        $(pane).style.width = '';
        continue;
      }
      const w = landscape ? d.h : d.w;
      const h = landscape ? d.w : d.h;
      el.style.width = w + 'px';
      el.style.height = h + 'px';
      $(pane).style.width = w + 'px';
    }

    // 자판 높이. 폰마다 다르고 한글·영문 자판도 다르다 — **어림**이다.
    // 세로에서는 화면의 1/3 쯤, 가로에서는 비율이 더 커진다(그래서 가로가 더 험하다)
    const kbOn = document.body.classList.contains('kb-on');
    for (const id of ['mobileKb', 'appKb']) {
      const kb = $(id);
      if (!kbOn) { kb.style.height = ''; continue; }
      const h = framed ? (landscape ? d.w : d.h) : window.innerHeight;
      const guess = landscape ? Math.round(h * 0.5) : Math.round(h * 0.36);
      kb.style.height = Math.max(180, Math.min(340, guess)) + 'px';
    }

    // 무엇을 보고 있는지 한 줄로 적는다 — 틀만 보고 있으면 어느 폰인지 잊는다
    const box = $('devNote');
    box.textContent = '';
    if (framed) {
      const nth = ORDER.indexOf(d.id) + 1;
      const name = document.createElement('b');
      name.textContent = d.name;
      const px = document.createElement('span');
      px.className = 'px';
      px.textContent = (landscape ? d.h + '×' + d.w + ' (가로)' : d.w + '×' + d.h);
      box.appendChild(name);
      box.appendChild(px);
      if (d.note) box.appendChild(document.createTextNode('· ' + d.note));
      const nthEl = document.createElement('span');
      nthEl.className = 'nth';
      nthEl.textContent = `폭 순서 ${nth} / ${ORDER.length}  ·  ◀ ▶ 또는 화살표 키로 넘김 · r 로 돌림`;
      box.appendChild(nthEl);
    }
    measure();
  }

  // ── 쪽 보이기 ──
  function show(mode) {
    $('paneMobile').classList.toggle('hide', mode === 'app');
    $('paneApp').classList.toggle('hide', mode === 'mobile');
    $('onlyMobile').classList.toggle('on', mode === 'mobile');
    $('onlyApp').classList.toggle('on', mode === 'app');
    $('both').classList.toggle('on', mode === 'both');
    measure();
  }

  // 지금 각 쪽의 **앱이 쓰는 자리**가 몇 ×몇 인지. 껍데기를 뺀 수다 —
  // 이 수가 폰에서 앱이 실제로 받는 높이다
  function measure() {
    for (const [kind, frame] of [['mobile', $('mobileFrame')], ['app', $('appFrame')]]) {
      const r = frame.getBoundingClientRect();
      const tag = $(kind + 'Tag');
      tag.textContent = r.width ? Math.round(r.width) + '×' + Math.round(r.height) : '';
      // 320 보다 좁아지면 앱이 가로로 밀린다 — 눈에 띄게 적어둔다
      tag.classList.toggle('off', r.width > 0 && r.width < 320);
    }
  }

  // ── 진짜 폰으로 보기 ──
  //
  // vite 플러그인이 이 PC 의 사설 IP 를 준다 (`/dev/net.json`).
  // 폰을 들고 그대로 치면 열린다 — **앱은 상대 주소로 서버를 부르므로**
  // (`/api`, vite 프록시가 받는다) 폰에서 따로 설정할 것이 없다.
  fetch('/dev/net.json')
    .then((r) => r.json())
    .then(({ port, urls }) => {
      const box = $('netUrls');
      box.textContent = '';
      if (!urls.length) {
        box.textContent = '이 PC 에 와이파이·랜 주소가 안 잡힙니다';
        return;
      }
      for (const u of urls) {
        const c = document.createElement('code');
        c.textContent = `http://${u.address}:${port}/`;
        c.title = u.name + ' — 눌러서 통째로 고른 뒤 복사하세요';
        box.appendChild(c);
        box.appendChild(document.createTextNode(' '));
      }
    })
    .catch(() => { $('netUrls').textContent = '주소를 못 읽었습니다 (개발 서버에서만 됩니다)'; });

  routeSel.addEventListener('change', () => load(routeSel.value));
  $('go').addEventListener('click', () => load($('path').value.trim() || '/home'));
  $('path').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('go').click(); });
  $('reload').addEventListener('click', () => load($('path').value.trim() || '/home'));
  devSel.addEventListener('change', () => { landscape = false; applyDevice(); });
  $('rotate').addEventListener('click', () => { landscape = !landscape; applyDevice(); });

  // ── 좁은 쪽부터 넘겨 훑기 ──
  //
  // 기기가 서른 가지가 되면 **목록에서 하나씩 고르는 것이 일**이 된다.
  // 폭 순서로 넘기면 어디서 처음 깨지는지가 바로 잡힌다 — 깨지는 자리는 거의 늘
  // 「어느 폭 아래부터」이기 때문이다.
  function step(dir) {
    const at = ORDER.indexOf(devSel.value);
    const i = at < 0 ? 0 : Math.min(ORDER.length - 1, Math.max(0, at + dir));
    devSel.value = ORDER[i];
    landscape = false;
    applyDevice();
  }
  $('prev').addEventListener('click', () => step(-1));
  $('next').addEventListener('click', () => step(1));
  // 화살표 키로도 넘긴다 — 글자 칸에 쓰는 중일 때는 비킨다
  window.addEventListener('keydown', (e) => {
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
    if (e.key === 'ArrowLeft') step(-1);
    else if (e.key === 'ArrowRight') step(1);
    else if (e.key === 'r') { landscape = !landscape; applyDevice(); }
  });
  $('onlyMobile').addEventListener('click', () => show('mobile'));
  $('onlyApp').addEventListener('click', () => show('app'));
  $('both').addEventListener('click', () => show('both'));
  $('chrome').addEventListener('click', (e) => {
    const off = document.body.classList.toggle('chrome-off');
    e.currentTarget.classList.toggle('on', !off);
    measure();
  });
  $('homebar').addEventListener('click', (e) => {
    const off = document.body.classList.toggle('bar-off');
    e.currentTarget.classList.toggle('on', !off);
    measure();
  });
  $('kb').addEventListener('click', (e) => {
    const on = document.body.classList.toggle('kb-on');
    e.currentTarget.classList.toggle('on', on);
    applyDevice();              // 자판 높이가 기기 크기에 따라 달라진다
  });

  let rt;
  window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(measure, 120); });

  const tick = () => {
    const d = new Date();
    $('clock').textContent = d.getHours() + ':' + String(d.getMinutes()).padStart(2, '0');
  };
  tick();
  setInterval(tick, 20000);

  // ?path=/train&device=galaxy 로 열면 그 자리부터
  const q = new URLSearchParams(location.search);
  const want = q.get('path');
  const dev = q.get('device');
  if (dev && DEVICES.some((d) => d.id === dev)) devSel.value = dev;
  else devSel.value = 'i13';            // 기본은 제일 흔한 폰
  load(want || '/home');
  if (want) routeSel.value = want;
  show('both');
  applyDevice();
  setTimeout(measure, 300);
})();
</script>
</body>
</html>
