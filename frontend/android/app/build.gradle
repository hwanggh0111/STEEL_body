apply plugin: 'com.android.application'

// `package.json` 하나가 버전의 주인이다 (2026-11-27 · 정석).
// `frontend/package.json` → 이 파일에서 `../../package.json`
def appVersionName = { ->
    def f = new File(projectDir, '../../package.json')
    if (!f.exists()) throw new GradleException("package.json 을 못 찾았다: ${f.canonicalPath}")
    def v = new groovy.json.JsonSlurper().parse(f).version
    if (!(v ==~ /\d+\.\d+\.\d+/)) throw new GradleException("package.json 의 version 꼴이 아니다: ${v}")
    return v
}()

def appVersionCode = { ->
    def (major, minor, patch) = appVersionName.tokenize('.').collect { it as int }
    if (minor > 99 || patch > 99) {
        throw new GradleException("versionCode 셈이 어긋난다 (minor·patch 는 99 까지): ${appVersionName}")
    }
    return major * 10000 + minor * 100 + patch
}()

android {
    namespace = "com.blackiron.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.blackiron.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // ── **버전을 손으로 맞추지 않는다** ── (2026-11-27 · 정석)
        //
        // 여기에 `versionName "1.0"` 이 박혀 있었고 `package.json` 은 `1.0.0` 이었다 —
        // **스토어는 「1.0」, 앱 화면은 「v1.0.0」** 으로 서로 다른 수를 말했다.
        // 두 자리를 손으로 맞추는 일은 반드시 한쪽이 빠진다. `package.json` 하나를 읽는다.
        //
        // `versionCode` 는 스토어가 **늘 커지기만 하는 정수**를 요구한다(올릴 때마다
        // 커야 한다). 버전에서 셈한다 — `1.0.0` → `10000` · `1.2.3` → `10203`.
        // 아직 스토어에 올린 판이 없어서(등록비 미결제) **1 에서 바꿔도 안전하다.**
        // 자리는 둘씩이니 `minor`·`patch` 가 100 을 넘으면 어긋난다 — 그날은 터뜨린다
        versionName appVersionName
        versionCode appVersionCode
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // ── 릴리스 서명 (2026-10-06) ──
    //
    // `assembleRelease` 는 서명이 없으면 **설치할 수 없는 APK** 를 뱉는다.
    // 그래서 폰에서 R8(minify) 깨짐을 볼 수가 없었다. 두 갈래로 나눈다.
    //
    //   1. `android/keystore.properties` 가 있으면 그것으로 서명한다 (플레이스토어용 진짜 열쇠)
    //   2. 없으면 **디버그 열쇠**로 서명한다 — 설치는 되고 R8 은 그대로 돈다
    //
    // 2번으로 만든 APK 는 플레이스토어에 못 올린다. 하지만 R8 이 지워버린 자리는
    // 똑같이 터지므로 **깨짐 확인에는 1번과 다를 바 없다.**
    signingConfigs {
        release {
            def props = new Properties()
            def f = rootProject.file('keystore.properties')
            if (f.exists()) {
                f.withInputStream { props.load(it) }
                storeFile     = rootProject.file(props['storeFile'])
                storePassword = props['storePassword']
                keyAlias      = props['keyAlias']
                keyPassword   = props['keyPassword']
            } else {
                // 디버그 열쇠로 떨어진다 (Android SDK 가 자동으로 만들어 둔 것)
                storeFile     = new File(System.getProperty('user.home'), '.android/debug.keystore')
                storePassword = 'android'
                keyAlias      = 'androiddebugkey'
                keyPassword   = 'android'
            }
        }
    }
    buildTypes {
        release {
            signingConfig = signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
