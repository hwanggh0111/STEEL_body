ext {
    // ── 안드로이드 8.0(API 26)부터 ── (2026-10-16)
    //
    // 24(안드로이드 7.0)였다. 건강 앱 연동이 쓰는 헬스 커넥트 라이브러리가
    // **26 미만을 아예 안 받는다**(connect-client 가 minSdk 26 이다).
    //
    // 억지로 끼울 길(`tools:overrideLibrary`)도 있지만 안 쓴다 — 그러면 안드로이드
    // 7 폰에서 그 화면을 열 때 **클래스를 못 찾아 앱이 죽는다.** 못 쓰는 사람에게
    // 「안 보인다」가 아니라 「죽는다」를 주는 쪽은 고를 수 없다.
    //
    // 7.0~7.1 은 2016년 폰이고 지금 쓰는 사람이 사실상 없다(1% 미만).
    // **건강연동을 빼기로 하면 24 로 되돌려도 된다** — 다른 기능은 24 에서 다 돈다
    // (docs/PLAY-STORE.md 의 「건강연동」 칸).
    minSdkVersion = 26
    compileSdkVersion = 36
    targetSdkVersion = 36
    androidxActivityVersion = '1.11.0'
    androidxAppCompatVersion = '1.7.1'
    androidxCoordinatorLayoutVersion = '1.3.0'
    androidxCoreVersion = '1.17.0'
    androidxFragmentVersion = '1.8.9'
    coreSplashScreenVersion = '1.2.0'
    androidxWebkitVersion = '1.14.0'
    junitVersion = '4.13.2'
    androidxJunitVersion = '1.3.0'
    androidxEspressoCoreVersion = '3.7.0'
    cordovaAndroidVersion = '14.0.1'
}