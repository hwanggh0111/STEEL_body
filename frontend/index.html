<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="BLACK IRON — 적은 것을 몸 그림으로 돌려주는 운동 기록 앱" />
    <title>BLACK IRON</title>

    <!-- ── 남이 링크를 보낼 때 보이는 것 ── (2026-10-20)
         카카오톡 · X · 슬랙에 주소를 붙이면 **제목도 그림도 없는 맨 링크**였다.
         앱 안에 공유 단추를 붙여둔 날(10/15)부터 이 자리가 비어 있던 셈이다 —
         받는 사람이 보는 것은 우리가 적어둔 이 여섯 줄이다.

         그림은 스토어 상단 그래픽을 쓴다(`npm run play:assets` 가 만든 것) —
         1024×500 이라 카드 비율(1.91:1)에 거의 맞고, **두 벌을 만들지 않는다.**
         주소는 **통째로** 적어야 한다 — 크롤러는 상대 주소를 못 푼다. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="BLACK IRON" />
    <meta property="og:title" content="무게는 늘었는데, 무엇이 늘었는지는 아무도 안 알려준다" />
    <meta property="og:description" content="세트를 적으면 몸 그림 · 들어올린 무게 · 1년 열두 판으로 돌려줍니다. 광고도 랭킹도 없습니다." />
    <meta property="og:url" content="https://steel-body.onrender.com/site" />
    <meta property="og:image" content="https://steel-body.onrender.com/images/share-card.png" />
    <meta property="og:image:width" content="1024" />
    <meta property="og:image:height" content="500" />
    <meta property="og:locale" content="ko_KR" />
    <!-- X 는 OG 를 읽지만, 큰 그림으로 펴려면 이 한 줄이 있어야 한다 -->
    <meta name="twitter:card" content="summary_large_image" />

    <!-- ── **글꼴은 우리 집에서 온다** ── (2026-11-13, 주인 지시)

         여기에 구글 글꼴 줄 다섯이 있었다 — preconnect 둘 · preload · stylesheet ·
         noscript, 그리고 아래 dns-prefetch. 11/13 에 재보니 **CSS 한 장이 gzip
         40.3KB**(@font-face 303개, IBM Plex Sans KR 혼자 282개)였고, 그것은
         **글꼴 한 자도 안 그리고 치르는 값**이었다. 집 두 곳(googleapis → gstatic)에
         왕복도 첫 방문마다 일어났다.

         넷을 잘라서 우리 주소에서 내준다(`npm run sans` · `src/styles/fonts.gen.css`).
         그래서 이 자리에는 **아무 줄도 없다** — 글꼴은 `globals.css` 가 들여오는
         `fonts.gen.css` 에 적혀 있고, 비테가 해시를 박아 `/assets/` 로 내보내므로
         **서비스 워커가 담는다**(지하 헬스장에서도 온다. 남의 집 것은 안 담긴다).

         명조는 10/20 에 먼저 우리 것이 됐다(`npm run serif`). 이것은 그 나머지다.

         미디어파이프의 두 집(wasm · 모델)은 여기 두지 않는다 — 「체형」·「횟수 세기」를
         연 사람만 가는 집이라, 안 여는 사람까지 값을 치를 이유가 없다. -->


    <!-- ── Favicon — **PNG 다** ── (2026-11-10)
         여태 `icon.svg` 하나였다. 주인이 고른 새 마크는 **받은 그림에서 잘라낸
         래스터**라(알파에 음영이 들어 있어 선으로는 못 그린다) 벡터로 만들 수 없다.
         그 PNG 를 base64 로 품은 SVG 를 쓸 수도 있지만 파비콘 하나에 44KB 는 과하다.
         그래서 **크기별 PNG 둘**로 간다 — 탭은 32, 바로가기·고해상도는 192.
         `icon.svg` 는 지웠다(쓰지 않는 파일을 남기면 어느 쪽이 참인지 흐려진다). -->
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#12100c" />

    <!-- Apple Mobile Web App -->
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- **`black-translucent` 에서 `black` 으로 바꿨다** (2026-10-05).
         `black-translucent` 는 아이폰에서 **내용을 상태바 아래로 밀어 넣는다** —
         홈 화면에 얹어 쓰는 사람은 머리말이 시계·배터리와 겹쳐 보였다.
         게다가 앱이 `env(safe-area-inset-*)` 를 **한 군데도 안 쓰고 있어서**
         비켜줄 자리도 없었다 (아래 globals.css 를 같이 고쳤지만, `viewport-fit=cover`
         가 없으면 iOS 에서 그 값은 0 이다).

         `black` 은 상태바 자리를 **비워 두고** 그 아래부터 그린다. 겹침이 사라진다.
         배경이 순검정(#000)이라 앱 바탕(#12100c)과 아주 조금 다르지만,
         겹쳐서 글자를 못 읽는 것보다 낫다.

         **끝까지 쓰는 화면(edge-to-edge)으로 가려면** `viewport-fit=cover` 를 더하고
         이 값을 되돌리면 된다. 다만 그러면 안드로이드에서도 Capacitor 가 네이티브
         여백 주기를 멈추고 CSS 에 맡기므로(`SystemBars.java`), **폰에서 보고 나서**
         할 일이다. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="BLACK IRON" />
    <!-- **아이폰은 SVG 터치 아이콘을 안 받는다** (2026-10-20에 고쳤다) — 홈 화면에
         얹으면 아이콘 자리에 **화면 캡처**가 들어간다. 180×180 PNG 를 준다
         ( 에서 줄였다 — 아이콘을 두 벌 그리지 않는다) -->
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon-180.png" />

    <!-- 테마는 다크 하나뿐이다. 라이트를 지운 뒤로는 고를 것이 없으므로
         localStorage 를 읽던 인라인 스크립트도 함께 없앴다 (첫 페인트가 한 단계 짧아진다). -->
    <style>
      html, body { background-color: #12100c; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
