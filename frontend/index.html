<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="BLACK IRON — 적은 것을 몸 그림으로 돌려주는 운동 기록 앱" />
    <title>BLACK IRON</title>

    <!-- ── 남이 링크를 보낼 때 보이는 것 ── (2026-10-20)
         카카오톡 · X · 슬랙에 주소를 붙이면 **제목도 그림도 없는 맨 링크**였다.
         앱 안에 공유 단추를 붙여둔 날(10/15)부터 이 자리가 비어 있던 셈이다 —
         받는 사람이 보는 것은 우리가 적어둔 이 여섯 줄이다.

         그림은 스토어 상단 그래픽을 쓴다(`npm run play:assets` 가 만든 것) —
         1024×500 이라 카드 비율(1.91:1)에 거의 맞고, **두 벌을 만들지 않는다.**
         주소는 **통째로** 적어야 한다 — 크롤러는 상대 주소를 못 푼다. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="BLACK IRON" />
    <meta property="og:title" content="무게는 늘었는데, 무엇이 늘었는지는 아무도 안 알려준다" />
    <meta property="og:description" content="세트를 적으면 몸 그림 · 들어올린 무게 · 1년 열두 판으로 돌려줍니다. 광고도 랭킹도 없습니다." />
    <meta property="og:url" content="https://steel-body.onrender.com/site" />
    <meta property="og:image" content="https://steel-body.onrender.com/images/share-card.png" />
    <meta property="og:image:width" content="1024" />
    <meta property="og:image:height" content="500" />
    <meta property="og:locale" content="ko_KR" />
    <!-- X 는 OG 를 읽지만, 큰 그림으로 펴려면 이 한 줄이 있어야 한다 -->
    <meta name="twitter:card" content="summary_large_image" />

    <!-- 폰트 프리커넥트 (렌더링 빠르게) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- 폰트는 여기서 부른다.
         globals.css 안의 @import 로 두면 브라우저가 CSS 를 받아 파싱한 뒤에야
         폰트 CSS 를 요청한다 — 요청이 한 단계 더 늘어 첫 글자가 늦게 뜬다.

         굵기는 **실제로 쓰는 것만** 부른다. Playfair 는 로고·스플래시에서 굵기 400
         (보통·이탤릭)만 쓴다 — 안 쓰는 500 두 변형(0,500·1,500)을 받던 것을 뺐다
         (2026-09-15). Barlow 다섯 굵기는 전부 쓰여서 그대로 둔다.

         **IBM Plex Sans KR 을 더했다** (2026-10-06) — **앱 본문의 한글이 여태 글꼴이
         없었다.** `font-family: 'Barlow'` 인데 Barlow 에는 한글이 한 자도 없어서,
         글자의 거의 전부가 **기기 기본 글꼴**로 떨어졌다(윈도우 맑은 고딕 · 안드로이드
         Roboto 대체 · 아이폰 Apple SD Gothic). 검정과 금색은 골라뒀는데 글자는 고른
         것이 아니었고, **기기마다 다른 앱으로 보였다.**

         Barlow 와 같은 그로테스크라 한글·영문이 섞인 줄에서 이음매가 안 보인다.
         굵기 다섯을 다 부르는 까닭은 앱이 **600 을 24곳, 700 을 22곳**에서 쓰기
         때문이다 — 굵기가 하나인 글꼴을 고르면 그 46곳이 브라우저 가짜 굵게로
         뭉개진다.

         **Nanum Myeongjo 를 더했다** (2026-09-16) — 새 화면 셋(몸 지도 · 운동 끝 결산 ·
         1년 기록 벽)의 첫 줄만 명조로 앉힌다(`.serif-display`). 한글 글꼴은 무거운데,
         구글이 한글을 조각 백여 개로 잘라 내주기 때문에 **화면에 쓴 글자가 든 조각만**
         내려온다. 굵기는 400 하나만 부른다. -->
    <!-- **첫 페인트를 막지 않게 받는다** (2026-10-05).

         이 한 줄이 `<head>` 의 보통 stylesheet 이면 **렌더링을 막는다** — 브라우저는
         이 CSS 가 올 때까지 글자를 한 자도 안 그린다. 폰에서는 그 한 번이 구글 두 곳
         (`fonts.googleapis.com` → `fonts.gstatic.com`)에 붙는 왕복이라, 신호가 나쁘면
         **아무것도 없는 검은 화면**이 그만큼 길어진다.

         `media="print"` 로 받으면 브라우저가 「지금 화면에 안 쓰는 것」으로 보고
         렌더링을 안 막는다. 다 받으면 `onload` 가 `all` 로 바꿔 그때 적용된다.
         이미 `display=swap` 이라 그때까지는 대체 글꼴로 글이 **보인다** — 안 보이던
         것이 보이게 되는 것이지, 늦어지는 것이 아니다.

         `preload` 를 같이 두는 까닭: `media="print"` 는 **낮은 순위로** 받는다.
         preload 가 「곧 쓸 것」이라고 알려줘서 순위를 되돌린다. -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@300;400;500;600;700&family=IBM+Plex+Sans+KR:wght@400;600;700&family=Playfair+Display:ital@0;1&display=swap"
    />
    <link
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@300;400;500;600;700&family=IBM+Plex+Sans+KR:wght@400;600;700&family=Playfair+Display:ital@0;1&display=swap"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@300;400;500;600;700&family=IBM+Plex+Sans+KR:wght@400;600;700&family=Playfair+Display:ital@0;1&display=swap"
      />
    </noscript>

    <!-- DNS 프리페치 — **실제로 묻는 집만** (2026-10-21에 둘을 걷었다)

         여기에 `wger.de` 와 `api.open-meteo.com` 이 「외부 API」라고 적혀 있었다.
         10/20 에 그 두 줄이 **아무 일도 안 하고 있던 것**을 찾아 서버 쪽에서 켰는데,
         오늘 보니 **두 집 다 앱이 묻지 않는 집**이었다 —

           api.open-meteo.com  날씨로 운동을 고르던 화면은 **8/19 에 지웠다**
                               (`WeatherWorkout.jsx`, 커밋 d2a6cbe). 두 달 동안
                               CSP 와 이 줄에만 남아 있었다
           wger.de             외부 운동 DB. 그쪽이 API 를 바꿔서 찾기 길이 **404** 다
                               (`components/ExerciseFinder.jsx` 머리글)

         즉 10/20 에 켠 것은 **아무도 안 가는 두 집의 주소를 매번 찾아두는 일**이었다.

         남는 것은 글꼴 파일이 오는 집 하나다 — 위의 스타일시트가 `fonts.googleapis.com`
         을 거쳐 **`fonts.gstatic.com`** 에서 파일을 받는다. 그 둘째 왕복은 **첫 방문마다**
         일어나므로 미리 찾아두는 값이 있다. 미디어파이프의 두 집(wasm · 모델)은 **여기
         두지 않는다** — 「체형」·「횟수 세기」를 연 사람만 가는 집이라, 안 여는 사람까지
         값을 치를 이유가 없다 (조각도 그때 받는다 — `data/poseModel.js`). -->
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#12100c" />

    <!-- Apple Mobile Web App -->
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- **`black-translucent` 에서 `black` 으로 바꿨다** (2026-10-05).
         `black-translucent` 는 아이폰에서 **내용을 상태바 아래로 밀어 넣는다** —
         홈 화면에 얹어 쓰는 사람은 머리말이 시계·배터리와 겹쳐 보였다.
         게다가 앱이 `env(safe-area-inset-*)` 를 **한 군데도 안 쓰고 있어서**
         비켜줄 자리도 없었다 (아래 globals.css 를 같이 고쳤지만, `viewport-fit=cover`
         가 없으면 iOS 에서 그 값은 0 이다).

         `black` 은 상태바 자리를 **비워 두고** 그 아래부터 그린다. 겹침이 사라진다.
         배경이 순검정(#000)이라 앱 바탕(#12100c)과 아주 조금 다르지만,
         겹쳐서 글자를 못 읽는 것보다 낫다.

         **끝까지 쓰는 화면(edge-to-edge)으로 가려면** `viewport-fit=cover` 를 더하고
         이 값을 되돌리면 된다. 다만 그러면 안드로이드에서도 Capacitor 가 네이티브
         여백 주기를 멈추고 CSS 에 맡기므로(`SystemBars.java`), **폰에서 보고 나서**
         할 일이다. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="BLACK IRON" />
    <!-- **아이폰은 SVG 터치 아이콘을 안 받는다** (2026-10-20에 고쳤다) — 홈 화면에
         얹으면 아이콘 자리에 **화면 캡처**가 들어간다. 180×180 PNG 를 준다
         ( 에서 줄였다 — 아이콘을 두 벌 그리지 않는다) -->
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon-180.png" />

    <!-- 테마는 다크 하나뿐이다. 라이트를 지운 뒤로는 고를 것이 없으므로
         localStorage 를 읽던 인라인 스크립트도 함께 없앴다 (첫 페인트가 한 단계 짧아진다). -->
    <style>
      html, body { background-color: #12100c; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
