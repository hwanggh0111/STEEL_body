<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="BLACK IRON - 운동 기록 & 인바디 관리 앱" />
    <title>BLACK IRON</title>

    <!-- 폰트 프리커넥트 (렌더링 빠르게) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- 폰트는 여기서 부른다.
         globals.css 안의 @import 로 두면 브라우저가 CSS 를 받아 파싱한 뒤에야
         폰트 CSS 를 요청한다 — 요청이 한 단계 더 늘어 첫 글자가 늦게 뜬다.

         굵기는 **실제로 쓰는 것만** 부른다. Playfair 는 로고·스플래시에서 굵기 400
         (보통·이탤릭)만 쓴다 — 안 쓰는 500 두 변형(0,500·1,500)을 받던 것을 뺐다
         (2026-09-15). Barlow 다섯 굵기는 전부 쓰여서 그대로 둔다.

         **Nanum Myeongjo 를 더했다** (2026-09-16) — 새 화면 셋(몸 지도 · 운동 끝 결산 ·
         1년 기록 벽)의 첫 줄만 명조로 앉힌다(`.serif-display`). 한글 글꼴은 무거운데,
         구글이 한글을 조각 백여 개로 잘라 내주기 때문에 **화면에 쓴 글자가 든 조각만**
         내려온다. 굵기는 400 하나만 부른다. -->
    <!-- **첫 페인트를 막지 않게 받는다** (2026-10-05).

         이 한 줄이 `<head>` 의 보통 stylesheet 이면 **렌더링을 막는다** — 브라우저는
         이 CSS 가 올 때까지 글자를 한 자도 안 그린다. 폰에서는 그 한 번이 구글 두 곳
         (`fonts.googleapis.com` → `fonts.gstatic.com`)에 붙는 왕복이라, 신호가 나쁘면
         **아무것도 없는 검은 화면**이 그만큼 길어진다.

         `media="print"` 로 받으면 브라우저가 「지금 화면에 안 쓰는 것」으로 보고
         렌더링을 안 막는다. 다 받으면 `onload` 가 `all` 로 바꿔 그때 적용된다.
         이미 `display=swap` 이라 그때까지는 대체 글꼴로 글이 **보인다** — 안 보이던
         것이 보이게 되는 것이지, 늦어지는 것이 아니다.

         `preload` 를 같이 두는 까닭: `media="print"` 는 **낮은 순위로** 받는다.
         preload 가 「곧 쓸 것」이라고 알려줘서 순위를 되돌린다. -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@300;400;500;600;700&family=Nanum+Myeongjo&family=Playfair+Display:ital@0;1&display=swap"
    />
    <link
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@300;400;500;600;700&family=Nanum+Myeongjo&family=Playfair+Display:ital@0;1&display=swap"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@300;400;500;600;700&family=Nanum+Myeongjo&family=Playfair+Display:ital@0;1&display=swap"
      />
    </noscript>

    <!-- DNS 프리페치 (외부 API) -->
    <link rel="dns-prefetch" href="https://wger.de" />
    <link rel="dns-prefetch" href="https://api.open-meteo.com" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#12100c" />

    <!-- Apple Mobile Web App -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="BLACK IRON" />
    <link rel="apple-touch-icon" href="/icons/icon.svg" />

    <!-- 테마는 다크 하나뿐이다. 라이트를 지운 뒤로는 고를 것이 없으므로
         localStorage 를 읽던 인라인 스크립트도 함께 없앴다 (첫 페인트가 한 단계 짧아진다). -->
    <style>
      html, body { background-color: #12100c; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
