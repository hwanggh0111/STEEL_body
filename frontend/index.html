<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="IRONLOG - 운동 기록 & 인바디 관리 앱" />
    <title>IRONLOG</title>

    <!-- 폰트 프리커넥트 (렌더링 빠르게) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- 폰트는 여기서 부른다.
         globals.css 안의 @import 로 두면 브라우저가 CSS 를 받아 파싱한 뒤에야
         폰트 CSS 를 요청한다 — 요청이 한 단계 더 늘어 첫 글자가 늦게 뜬다. -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@1,700&display=swap"
    />

    <!-- DNS 프리페치 (외부 API) -->
    <link rel="dns-prefetch" href="https://wger.de" />
    <link rel="dns-prefetch" href="https://api.open-meteo.com" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#12100c" />

    <!-- Apple Mobile Web App -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="IRONLOG" />
    <link rel="apple-touch-icon" href="/icons/icon.svg" />

    <!-- 테마는 다크 하나뿐이다. 라이트를 지운 뒤로는 고를 것이 없으므로
         localStorage 를 읽던 인라인 스크립트도 함께 없앴다 (첫 페인트가 한 단계 짧아진다). -->
    <style>
      html, body { background-color: #12100c; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
