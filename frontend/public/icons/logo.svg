<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- STEEL BODY 앱 아이콘 — 앱 안의 로고(배지)와 같은 마크다.
       격자 24칸에 획 2칸으로 그린 것을 512 로 키웠다 (×21.333).
       예전에는 빨간 날개 달린 사람 그림이었다 — 머리의 로고와 아무 관계가 없었다. -->
  <defs>
    <linearGradient id="plate" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#241c14"/>
      <stop offset="100%" stop-color="#12100c"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#plate)"/>

  <!-- 링 — 획의 절반. 가둔다기보다 감싼다 -->
  <circle cx="256" cy="256" r="182" fill="none" stroke="#eeb77d" stroke-width="21" opacity="0.7"/>

  <!-- 바벨 — 봉 하나, 안쪽 판 둘 -->
  <g stroke="#eeb77d" stroke-width="43" stroke-linecap="round">
    <path d="M220 256 H292"/>
    <path d="M196 137 V375"/>
    <path d="M316 137 V375"/>
  </g>
  <!-- 바깥 판 — 조금 짧고 조금 흐리게 -->
  <g stroke="#eeb77d" stroke-width="43" stroke-linecap="round" opacity="0.55">
    <path d="M143 188 V324"/>
    <path d="M369 188 V324"/>
  </g>
</svg>
