<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- BLACK IRON 앱 아이콘 — 앱 안의 로고 마크와 **같은 그림**이다.
       격자 24칸으로 그린 것을 512 로 키웠다 (×21.333).

       2026-09-01 저녁에 각을 버렸다. 그 전에는 마름모(각 넷)였는데 딱딱했다 —
       홈 화면은 둥근 사각형 안에 그림이 들어가는 자리라, 안에 또 각진 도형을 넣으면
       모서리끼리 부딪힌다. **링 하나에 봉 하나**로 바꿨다.
       원은 어느 크기로 줄여도 뭉개지지 않는 유일한 모양이다.

       금색은 한 색으로 납작하게 쓴다. 그라데이션을 넣으면 화면에서 금속을 흉내 내는
       꼴이 되고, 대개 싸 보인다. 바탕만 아주 옅게 눕혔다 (순검정이면 어두운 배경에
       아이콘이 통째로 사라진다). -->
  <defs>
    <linearGradient id="plate" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1b1712"/>
      <stop offset="100%" stop-color="#100e0b"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#plate)"/>

  <!-- 링 — 원판을 정면에서 본 모양. 선 굵기는 로고와 같은 비율(1.1/24) -->
  <circle cx="256" cy="256" r="196" fill="none" stroke="#eeb77d" stroke-width="23"/>
  <!-- 봉 — 링 밖으로 조금 나간다. 갇힌 그림이 아니라 지나가는 그림이 되게 -->
  <path d="M34 256 H478" stroke="#eeb77d" stroke-width="23" stroke-linecap="round"/>
</svg>
