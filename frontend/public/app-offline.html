<!doctype html>
<!-- 안드로이드 앱이 서버에 못 닿았을 때 보이는 화면 (capacitor.config.ts 의 errorPath).
     APK 안에 들어 있어서 인터넷 없이도 뜬다 — 그래서 글꼴을 받아오지 않고 기기 글꼴을 쓴다.
     크롬의 「웹페이지를 사용할 수 없음」 대신 무엇을 하면 되는지 말한다. -->
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#12100c" />
  <title>BLACK IRON</title>
  <style>
    :root { --bg: #12100c; --accent: #eeb77d; --text: #f3ece2; --muted: #a39a8c; --line: #2a251e; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
      font-family: system-ui, -apple-system, 'Noto Sans KR', sans-serif; }
    main { min-height: 100%; display: flex; flex-direction: column; align-items: center;
      justify-content: center; padding: 32px 28px; text-align: center; }
    svg { width: 72px; height: 72px; margin-bottom: 28px; }
    h1 { font-size: 20px; font-weight: 700; margin: 0 0 10px; letter-spacing: -0.01em; }
    p { font-size: 15px; line-height: 1.6; color: var(--muted); margin: 0; max-width: 300px; }
    button { margin-top: 32px; width: 100%; max-width: 280px; height: 52px; border: 0;
      border-radius: 14px; background: var(--accent); color: #12100c; font-size: 16px;
      font-weight: 700; font-family: inherit; }
    button:disabled { opacity: 0.55; }
    .addr { margin-top: 28px; padding-top: 16px; border-top: 1px solid var(--line);
      font-size: 12px; color: var(--muted); word-break: break-all; max-width: 280px; }
    .addr:empty { display: none; }

    /* 깨우는 동안 보여주는 띠. 값이 아니라 **움직이고 있다는 것**을 말한다 —
       무료 판이 깨는 데 몇 초 걸릴지는 우리도 모른다 */
    .wake { width: 100%; max-width: 280px; margin-top: 26px; }
    .wake[hidden] { display: none; }
    .bar { height: 4px; border-radius: 2px; background: var(--line); overflow: hidden; }
    .bar i { display: block; height: 100%; width: 38%; border-radius: 2px; background: var(--accent);
      animation: slide 1.5s ease-in-out infinite; }
    @keyframes slide { 0% { transform: translateX(-110%); } 100% { transform: translateX(300%); } }
    .elapsed { margin-top: 10px; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
    @media (prefers-reduced-motion: reduce) {
      .bar i { animation: none; width: 100%; opacity: 0.5; }
    }
  </style>
</head>
<body>
  <main>
    <svg viewBox="0 0 512 512" aria-hidden="true">
      <circle cx="256" cy="256" r="196" fill="none" stroke="#eeb77d" stroke-width="23" />
      <path d="M34 256 H478" stroke="#eeb77d" stroke-width="23" stroke-linecap="round" />
    </svg>
    <h1 id="head">서버에 연결할 수 없어요</h1>
    <p id="why">인터넷 연결을 확인하고 다시 시도해 주세요.</p>
    <div class="wake" id="wake" hidden>
      <div class="bar" aria-hidden="true"><i></i></div>
      <div class="elapsed" id="elapsed">기다린 시간 0초</div>
    </div>
    <button id="retry" type="button">다시 시도</button>
    <div class="addr" id="addr"></div>
  </main>
  <script>
    var app = window.BlackIronApp;
    var btn = document.getElementById('retry');

    // 어느 주소를 못 열었는지. 집 와이파이 시험판(192.168.x)은 무엇을 봐야 하는지 다르다
    try {
      var url = app && app.serverUrl();
      if (url) {
        document.getElementById('addr').textContent = url;
        if (/^http:\/\/(192\.168|10\.|172\.(1[6-9]|2\d|3[01]))/.test(url)) {
          document.getElementById('why').textContent =
            '시험용 앱이에요. 폰이 개발 PC 와 같은 와이파이에 있고, PC 에서 서버가 켜져 있어야 열려요.';
        }
      }
    } catch (e) {}

    function retry() {
      btn.disabled = true;
      btn.textContent = '연결하는 중…';
      if (app && app.retry) app.retry();
      else location.reload();
    }

    btn.addEventListener('click', retry);
    // 인터넷이 돌아오면 누르지 않아도 다시 연다
    window.addEventListener('online', retry);

    // ── 못 닿은 것과 **아직 안 깬 것**은 다르다 ── (2026-10-15)
    //
    // 이 앱이 사는 곳은 15분 놀면 잠드는 무료 판이고, 깨는 데 수십 초 걸린다.
    // 앱은 15초에 포기하고 이 화면으로 넘기는데(`MainActivity.LOAD_TIMEOUT_MS`),
    // 그러면 **멀쩡한 서버를 두고 「연결할 수 없어요」라고 말한 셈**이 된다.
    // 쓰는 사람 눈에는 앱이 고장난 것으로 보이고, 심사자에게도 그렇게 보인다.
    //
    // 그래서 인터넷이 있으면 **깨우기를 계속 기다린다.** 서버가 답하는 순간 다시 연다.
    //
    // 왜 `no-cors` 인가 — 이 화면은 APK 안에서 뜨므로 출처가 서버와 다르고,
    // 서버의 CORS 허용 목록에 없다. 알맹이는 못 읽지만 **답했는지 안 했는지**는
    // 알 수 있고(성공하면 resolve, 못 닿으면 reject) 여기서 필요한 것은 그것뿐이다.
    // 잠든 서버는 거절하지 않고 **연결을 붙잡아 두므로**, 깨는 순간 이 약속이 풀린다.
    var waking = false;
    var started = 0;
    var tick = null;

    function showWaking() {
      document.getElementById('head').textContent = '서버를 깨우고 있어요';
      document.getElementById('why').textContent =
        '쉬고 있던 서버라 처음 열 때 조금 걸려요. 깨면 바로 들어갑니다 — 다음부터는 기다리지 않아요.';
      document.getElementById('wake').hidden = false;
      btn.textContent = '그냥 다시 시도';
      started = Date.now();
      tick = setInterval(function () {
        var s = Math.round((Date.now() - started) / 1000);
        document.getElementById('elapsed').textContent = '기다린 시간 ' + s + '초';
      }, 1000);
    }

    function stopWaking() {
      if (tick) { clearInterval(tick); tick = null; }
    }

    function pokeServer() {
      var url;
      try { url = app && app.serverUrl(); } catch (e) { url = null; }
      if (!url) return;                      // 주소를 모르면 할 수 있는 것이 없다
      if (!('fetch' in window)) return;

      // 캐시를 타지 않게 꼬리를 붙인다 — 깼는지를 묻는 것이라 옛 답은 쓸모가 없다
      var probe = url.replace(/\/$/, '') + '/api/health?wake=' + Date.now();
      fetch(probe, { mode: 'no-cors', cache: 'no-store' })
        .then(function () {
          stopWaking();
          document.getElementById('head').textContent = '깼어요';
          document.getElementById('why').textContent = '화면을 여는 중입니다.';
          retry();
        })
        .catch(function () {
          // 못 닿았다 — 깨는 중일 수도, 정말 안 될 수도 있다. 2초 뒤에 다시 묻는다.
          // **멈추지 않는다**: 멈추면 사람이 단추를 눌러야 하고, 그건 지금 하던 일과 같다
          if (waking) setTimeout(pokeServer, 2000);
        });
    }

    if (navigator.onLine !== false) {
      waking = true;
      showWaking();
      pokeServer();
    }
    // 인터넷이 없으면 위의 「연결을 확인해 주세요」 그대로 둔다 — 그때는 사실이다
  </script>
</body>
</html>
