services:
  - type: web
    name: blackiron
    runtime: node
    plan: free
    region: oregon
    buildCommand: cd frontend && npm install && npm run build && cd ../backend && npm install
    startCommand: cd backend && node --max-old-space-size=256 --optimize-for-size src/index.js
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      # Render 는 앱 앞에 프록시가 1 홉 있다. 그 홉만 믿어 req.ip 를 진짜 클라이언트로 읽는다.
      # 이 값이 없으면 서버는 X-Forwarded-For 를 안 믿어(기본 0), 모든 요청이 프록시 IP 하나로
      # 합쳐져 rate limit 이 전체를 함께 막는다. 직접 노출 시 헤더 위조를 막는 것과 같은 스위치다.
      - key: TRUST_PROXY
        value: "1"
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://blackiron.onrender.com
      - key: BACKEND_URL
        value: https://blackiron.onrender.com
      - key: ADMIN_EMAIL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      # 나머지 소셜 로그인. 서버는 넷을 다 지원한다.
      # **넣은 것만 로그인 화면에 버튼으로 나온다** — 안 넣으면 아예 안 보인다.
      # 인스타그램만 이름이 APP_ID 다 (CLIENT_ID 가 아니다)
      - key: NAVER_CLIENT_ID
        sync: false
      - key: NAVER_CLIENT_SECRET
        sync: false
      - key: FACEBOOK_APP_ID
        sync: false
      - key: FACEBOOK_APP_SECRET
        sync: false
      - key: INSTAGRAM_APP_ID
        sync: false
      - key: INSTAGRAM_APP_SECRET
        sync: false
      # 운동 알림(웹 푸시). `node backend/scripts/gen-vapid.js` 로 만들어 대시보드에서 넣는다.
      # 없어도 서버는 그대로 뜬다 — 알림만 안 나간다.
      # **한 번 정하면 바꾸지 않는다.** 바꾸면 지금 있는 알림 구독이 전부 끊긴다
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
