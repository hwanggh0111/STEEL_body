services:
  - type: web
    name: steel-body
    runtime: node
    plan: free
    region: oregon
    buildCommand: cd frontend && npm install && npm run build && cd ../backend && npm install
    startCommand: cd backend && node --max-old-space-size=256 --optimize-for-size src/index.js
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://steel-body.onrender.com
      - key: BACKEND_URL
        value: https://steel-body.onrender.com
      - key: ADMIN_EMAIL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      # 운동 알림(웹 푸시). `node backend/scripts/gen-vapid.js` 로 만들어 대시보드에서 넣는다.
      # 없어도 서버는 그대로 뜬다 — 알림만 안 나간다.
      # **한 번 정하면 바꾸지 않는다.** 바꾸면 지금 있는 알림 구독이 전부 끊긴다
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
