services:
  - type: web
    name: steel-body
    runtime: node
    plan: free
    region: oregon
    buildCommand: cd frontend && npm install && npm run build && cd ../backend && npm install
    startCommand: cd backend && node --max-old-space-size=256 --optimize-for-size src/index.js
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      # 앞에 있는 프록시 중 **사설 주소인 홉만** 믿는다 → req.ip 가 진짜 접속자가 된다.
      #
      # 2026-10-15 에 "1" 에서 "private" 으로 바꿨다. Render 는 1 홉이 아니라 XFF 끝에
      # 내부 주소(10.31.x.x)를 하나 더 붙인다 — 그래서 차단 목록에 사람 IP 가 아니라
      # 그 내부 주소가 남았고, **한 명이 차단되면 그 홉을 지나는 사람이 전부 막혔다.**
      # 홉 수를 "2" 로 올리는 것은 답이 아니다(홉이 하나 더 끼면 또 깨지고, 엣지가
      # 하나뿐인 순간에는 클라이언트가 적어 보낸 값을 그대로 믿는다).
      # 자세한 까닭은 backend/src/index.js 의 trustProxy 주석에 적어뒀다.
      - key: TRUST_PROXY
        value: private
      - key: JWT_SECRET
        generateValue: true
      # ── 잠들지 않게 스스로 두드린다 ── (2026-10-16)
      #
      # 무료 판은 **15분 놀면 자고, 깨는 데 22.3초**다(10/15 실측). 그 22초를 가장
      # 먼저 만나는 사람이 **플레이스토어 심사자**다 — 출시 직후의 앱은 거의 늘
      # 잠들어 있다. 서버가 14분마다 제 `/api/health` 를 두드려 깨어 있는다.
      #
      # **공짜가 아니다.** 무료 판은 한 달 750 인스턴스 시간이고 24시간 깨어 있으면
      # 약 730시간이다 — **무료 웹 서비스가 이것 하나일 때만** 맞다.
      #   · 줄이려면 `KEEP_WARM_HOURS` 에 `6-24` (서울 시각, 그 시간대만 깨운다)
      #   · 유료 $7 로 올리면 애초에 안 잠든다 → 그때는 `KEEP_WARM=0` 으로 끈다
      # 자세한 까닭은 backend/src/utils/keepWarm.js 머리글에 적어뒀다
      - key: KEEP_WARM
        value: "1"
      - key: KEEP_WARM_HOURS
        sync: false
      # ── 배포 주소는 `steel-body` 다 ── (2026-10-09 에 본인이 정함)
      #
      # 10/1 까지 여기는 `blackiron`, 구글 콘솔은 `steel-body` 로 **갈려 있었다.**
      # 그대로 배포하면 구글 로그인이 `redirect_uri_mismatch` 로 막힌다.
      # **콘솔을 안 건드리는 쪽**으로 정했다 — 고칠 곳은 이 파일과 앱 껍데기뿐이다.
      - key: FRONTEND_URL
        value: https://steel-body.onrender.com
      - key: BACKEND_URL
        value: https://steel-body.onrender.com
      - key: ADMIN_EMAIL
        sync: false
      # ── 기록이 살아남게 ── (2026-10-01)
      #
      # **이 값이 없으면 기록이 재시작마다 사라진다.** 무료 판은 디스크를 못 붙여서
      # 파일로 두면 배포할 때마다 · 잠들었다 깰 때마다 blackiron.json 이 없어진다.
      #
      # 무료 Postgres(Neon 등)를 만들어 그 연결 주소를 여기 넣는다. 처음 한 번은
      # 서버가 **쓰던 파일을 그대로 옮겨** 올린다(이미 들어 있으면 안 덮는다).
      #
      # 비워두면 파일로 돈다 — 내 컴퓨터에서 그렇게 쓴다
      - key: DATABASE_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      # ── 소셜 로그인은 **둘이다** — 구글 · 네이버 ── (2026-10-09)
      #
      # 받는 절차는 docs/social-login-setup.md 에 한 장으로 적어뒀다.
      #
      #   카카오 · 페이스북   2026-10-07 에 걷어냈다
      #   인스타그램          2026-10-09. 열쇠까지 꽂았는데 **인스타가 막았다** —
      #                       심사 전에는 앱 역할에 등록된 계정만, 끝까지 가도
      #                       **프로페셔널 계정만** 들어온다. 쓰는 사람에게 계정
      #                       전환을 시킬 수 없어서 접었다
      #   트위터(X)           2026-10-09. 막힌 것은 없다 — 열쇠 받는 손을 안 쓰기로 했다
      #
      # 넷 다 **길은 코드에 살아 있다**(`npm run oauth` 가 끝까지 돌려본다).
      # 되살리는 날 여기에 열쇠 줄을 다시 넣는다.
      - key: NAVER_CLIENT_ID
        sync: false
      - key: NAVER_CLIENT_SECRET
        sync: false
      # 메일 보내기. **비밀번호 찾기와 가입 인증번호**가 이걸 쓴다 — 없으면
      # 「비밀번호 찾기」 화면이 **누르기 전에** 지금은 안 된다고 말한다 (2026-10-01)
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      # 운동 알림(웹 푸시). `node backend/scripts/gen-vapid.js` 로 만들어 대시보드에서 넣는다.
      # 없어도 서버는 그대로 뜬다 — 알림만 안 나간다.
      # **한 번 정하면 바꾸지 않는다.** 바꾸면 지금 있는 알림 구독이 전부 끊긴다
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
